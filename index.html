<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지우현 존@나패기 (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #1b1a22; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    font-family: "Black Han Sans", "Malgun Gothic", sans-serif;
  }
  /* 커서는 JS가 조준점 SVG(하드웨어 커서)로 바꿈. 그 전엔 기본 십자선 */
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  .overlay {
    position: fixed; inset: 0; z-index: 10; padding: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 6, 14, .82);
  }
  .hidden { display: none !important; }

  /* 아이템 획득 */
  #itemGet { background: rgba(8, 6, 14, .86); z-index: 12; }
  .item-get { text-align: center; color: #fff; animation: igPop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .item-get .ig-head { font-size: clamp(40px, 7vw, 72px); color: #fff27a; -webkit-text-stroke: 2px #1a0008; filter: drop-shadow(0 4px 0 #000); letter-spacing: 3px; }
  .item-get .ig-icon { position: relative; width: min(260px, 24vh); height: min(260px, 24vh); margin: 14px auto; display: flex; align-items: center; justify-content: center; }
  .item-get .ig-icon::before { content: ""; position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, var(--gc) 0%, transparent 65%); opacity: .55; animation: igGlow 1.6s ease-in-out infinite; }
  .item-get .ig-icon img { position: relative; max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 18px var(--gc)); }
  .item-get .ig-name { font-size: 40px; color: var(--gc); -webkit-text-stroke: 1.5px #000; filter: drop-shadow(0 3px 0 #000); }
  .item-get .ig-grade { font-family: "Malgun Gothic", sans-serif; font-size: 17px; color: var(--gc); margin-top: 4px; }
  .item-get .ig-desc { font-family: "Malgun Gothic", sans-serif; font-size: 15px; color: #ddd; margin-top: 10px; }
  .item-get .ig-hp { font-size: 30px; color: #5be07a; margin-top: 14px; -webkit-text-stroke: 1px #000; }
  .item-get .ig-key { font-family: "Malgun Gothic", sans-serif; font-size: 15px; color: #aaa; margin-top: 18px; animation: igBlink 1s steps(2) infinite; }
  .item-get .ig-heals { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin: 16px 0 4px; }
  .item-get .ig-heal { width: 190px; padding: 12px 10px; border: 2px solid var(--gc); border-radius: 14px; background: rgba(255,255,255,.06); }
  .item-get .ig-heal img { width: min(110px, 11vh); height: min(110px, 11vh); object-fit: contain; filter: drop-shadow(0 0 12px var(--gc)); }
  .item-get .ig-heal b { display: block; font-size: 22px; font-weight: normal; color: var(--gc); margin-top: 6px; }
  .item-get .ig-heal small { display: block; font-family: "Malgun Gothic", sans-serif; font-size: 14px; color: #ddd; margin-top: 2px; }
  .item-get .ig-chapters { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; margin: 26px 0 4px; }
  .item-get .ig-ch { width: 230px; background: rgba(255,255,255,.06); border: 2px solid #ffd23a; border-radius: 14px; overflow: hidden; padding-bottom: 12px; box-shadow: 0 0 24px rgba(255,210,58,.35); }
  .item-get .ig-thumb { height: 130px; background: #222 center / cover no-repeat; margin-bottom: 10px; }
  .item-get .ig-ch small { display: block; font-family: "Malgun Gothic", sans-serif; font-size: 13px; color: #ffd23a; letter-spacing: 1px; }
  .item-get .ig-ch b { display: block; font-size: 22px; font-weight: normal; margin-top: 2px; padding: 0 10px; }
  @keyframes igPop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes igGlow { 50% { transform: scale(1.12); opacity: .85; } }
  @keyframes igBlink { 50% { opacity: .35; } }

  /* 시작 / 결과 화면 */
  .panel { text-align: center; color: #fff; max-width: 560px; width: 100%; }
  .title {
    font-size: clamp(64px, 15vw, 132px); line-height: 1.05; letter-spacing: 2px;
    background: linear-gradient(#fff27a, #ff7a1a 60%, #ff2a3d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px #1a0008;
    filter: drop-shadow(0 6px 0 #000) drop-shadow(0 0 28px rgba(255, 80, 60, .55));
  }
  .title.game-name { font-size: clamp(44px, 8vw, 96px); white-space: nowrap; }
  .sub { font-size: 18px; color: #ffb0d8; letter-spacing: 2px; margin: 6px 0 26px; }
  .keys { display: inline-flex; flex-direction: column; gap: 10px; text-align: left; font-size: 21px; margin-bottom: 18px; }
  .kbd { display: inline-block; min-width: 150px; text-align: center; background: #ffd23a; color: #1a0008; padding: 3px 10px; border-radius: 8px; margin-right: 12px; box-shadow: 0 3px 0 #000; }
  .tip { font-family: "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.7; color: #ddd; margin-bottom: 26px; }
  .small { font-family: "Malgun Gothic", sans-serif; font-size: 13px; color: #aaa; margin-top: 12px; }
  .stats { display: flex; justify-content: center; gap: 26px; margin: 6px 0 28px; flex-wrap: wrap; }
  .stats div { display: flex; flex-direction: column; gap: 4px; }
  .stats span { font-size: 15px; color: #ffb0d8; }
  .stats b { font-size: 36px; font-weight: normal; color: #ffe27a; }
  button {
    font-family: inherit; font-size: 28px; padding: 14px 48px; cursor: pointer;
    border: 3px solid #1a0008; border-radius: 14px; color: #1a0008;
    background: linear-gradient(#ffe27a, #ff7a1a); box-shadow: 0 6px 0 #000;
    transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
  button:disabled { filter: grayscale(1) brightness(.6); cursor: default; }

  /* 인벤토리 */
  .inv-panel {
    width: min(1000px, 100%); height: min(780px, calc(100vh - 32px)); display: flex; flex-direction: column;
    background: #17141f; border: 2px solid #3a2f4a; border-radius: 16px;
    padding: 20px; color: #fff; font-family: "Malgun Gothic", sans-serif; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  .inv-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .inv-head h2 { margin: 0; font-family: "Black Han Sans", sans-serif; font-weight: normal; font-size: 30px; }
  .inv-head h2 small { font-family: "Malgun Gothic", sans-serif; font-size: 14px; color: #ffb0d8; margin-left: 10px; }
  .inv-head button { font-size: 16px; padding: 6px 16px; box-shadow: 0 3px 0 #000; border-width: 2px; }
  .inv-body { display: grid; grid-template-columns: 220px 1fr 280px; gap: 20px; flex: 1; min-height: 0; }
  @media (max-width: 900px) { .inv-body { grid-template-columns: 1fr; } }
  .label { font-size: 13px; color: #aaa; margin-bottom: 8px; }
  .equip-slot {
    display: flex; gap: 10px; align-items: center; background: #221c2e; border: 2px solid #3a3150;
    border-radius: 12px; padding: 8px; margin-bottom: 14px; cursor: pointer;
  }
  .equip-slot img { width: 56px; height: 56px; object-fit: contain; background: #2d2540; border-radius: 8px; flex: none; }
  .equip-slot b { display: block; font-size: 15px; }
  .equip-slot small { color: #999; font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    font-family: "Malgun Gothic", sans-serif; font-size: 15px; font-weight: bold; padding: 8px 18px;
    background: #221c2e; color: #aaa; border: 2px solid #3a3150; border-radius: 10px; box-shadow: none;
  }
  .tab:active { transform: none; box-shadow: none; }
  .tab.on { background: #ffd23a; color: #1a0008; border-color: #1a0008; }
  .inv-body > div { min-width: 0; }
  .inv-col { display: flex; flex-direction: column; min-height: 0; }
  .bag {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-content: start;
    flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 4px 4px;
  }
  .slot {
    aspect-ratio: 1; background: #221c2e; border: 2px dashed #3a3150; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: #555; font-size: 12px; text-align: center; padding: 4px; position: relative;
  }
  .slot.has { border-style: solid; cursor: pointer; color: #ddd; }
  .slot.sel { box-shadow: 0 0 0 3px #fff; }
  .slot .tag { position: absolute; top: 4px; right: 6px; font-size: 10px; color: #ffd23a; }
  .slot img { width: 58%; height: 58%; object-fit: contain; }
  .grades { background: #1e1928; border-radius: 12px; padding: 10px 12px; }
  .grades .row { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.9; }
  .grades i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .detail { background: #1e1928; border-radius: 12px; padding: 14px; font-size: 13px; min-height: 0; overflow-y: auto; }
  .detail .dname { font-family: "Black Han Sans", sans-serif; font-size: 22px; }
  .detail .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; color: #111; margin: 6px 0 10px; font-weight: bold; }
  .detail .dimg { width: 100%; height: 110px; object-fit: contain; background: #2d2540; border-radius: 8px; margin-bottom: 10px; }
  .detail p { color: #bbb; margin: 0 0 10px; line-height: 1.6; }
  .wstats { font-size: 13px; line-height: 2; margin-bottom: 10px; }
  .wstats div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #2a2436; }
  .wstats span { color: #aaa; }
  .wstats b { color: #ffe27a; font-weight: normal; text-align: right; }
  .ability { border: 2px solid #5ac8ff; border-radius: 10px; padding: 10px; background: rgba(90, 200, 255, .07); }
  .ability.none { border-color: #3a3150; background: none; color: #777; }
  .ability h4 { margin: 0 0 6px; font-size: 14px; color: #8fd8ff; }
  .ability ul { margin: 0; padding-left: 18px; line-height: 1.7; color: #ddd; }
  .detail .act { width: 100%; margin-top: 12px; font-size: 18px; padding: 8px; }
  .wip { color: #ffb03c; font-size: 12px; }

  /* 타이틀 화면 */
  .screen { position: fixed; inset: 0; z-index: 9; overflow: hidden; background: #000; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .menu-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .menu-title {
    position: absolute; left: 80px; top: 60px; width: 1281px; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .5));
    transform-origin: 40% 50%; animation: titlePulse 1.6s ease-in-out infinite;   /* 커졌다 작아졌다 */
  }
  @keyframes titlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .menu-items { position: absolute; left: 100px; top: 330px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  .mi {
    font-family: "Malgun Gothic", sans-serif; font-weight: 900; font-size: 72px; letter-spacing: 2px;
    color: #ff8c1a; background: none; border: none; box-shadow: none; padding: 0;
    text-shadow: 0 4px 0 #3a1200, 0 0 18px rgba(0, 0, 0, .6); transition: color .08s, transform .12s;
  }
  .mi:hover, .mi:focus-visible { color: #ff2020; transform: translateX(16px) scale(1.04); outline: none; }
  .mi:active { transform: translateX(16px) scale(.98); box-shadow: none; }
  .menu-load { position: absolute; left: 104px; bottom: 50px; font-family: "Malgun Gothic", sans-serif; font-size: 22px; color: #ddd; }
  .menu-ver { position: absolute; right: 16px; bottom: 12px; z-index: 1; font-family: "Malgun Gothic", sans-serif; font-size: 16px; color: #fff; pointer-events: none; }

  /* 챕터 선택 / 개발자 / 일시정지 */
  .box {
    width: min(520px, 100%); background: #17141f; border: 2px solid #3a2f4a; border-radius: 18px;
    padding: 26px; color: #fff; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  .box.wide { width: min(860px, 100%); }
  .box h2 { margin: 0 0 20px; font-weight: normal; font-size: 40px; color: #ffd23a; }
  .chapter-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 22px; }
  .chapter-card {
    font-family: inherit; text-align: left; padding: 0; overflow: hidden; border-radius: 14px;
    background: #221c2e; color: #fff; border: 3px solid #3a3150; box-shadow: 0 6px 0 #000;
  }
  .chapter-card:hover { border-color: #ffd23a; }
  .chapter-card .thumb { height: 150px; background: #2d2540 center / cover no-repeat; }
  .chapter-card .info { padding: 12px 16px; }
  .chapter-card .info small { display: block; font-size: 15px; color: #ffb0d8; }
  .chapter-card .info b { display: block; font-size: 30px; font-weight: normal; }
  .back { font-size: 20px; padding: 8px 26px; box-shadow: 0 4px 0 #000; }
  .dev-body { font-family: "Malgun Gothic", sans-serif; font-size: 18px; line-height: 1.6; margin-bottom: 22px; }
  .dev-body b { color: #ffb03c; }
  .set-row, .set-col { display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left; padding: 14px 0; border-bottom: 1px solid #2a2436; font-family: "Malgun Gothic", sans-serif; font-size: 18px; }
  .set-col { flex-direction: column; align-items: stretch; margin-bottom: 18px; }
  .set-row small, .set-col small { display: block; font-size: 12px; color: #999; margin-top: 2px; }
  .set-row button { font-size: 16px; padding: 8px 18px; box-shadow: 0 3px 0 #000; min-width: 90px; }
  .toggle.off { background: linear-gradient(#777, #555); color: #eee; }
  .danger { background: linear-gradient(#ff7a7a, #e0242f); color: #fff; }
  #cmdForm { display: flex; gap: 8px; }
  #cmdInput { flex: 1; font-family: Consolas, monospace; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 2px solid #3a3150; background: #0d0b12; color: #7affb0; }
  #cmdForm button { font-size: 16px; padding: 6px 16px; box-shadow: 0 3px 0 #000; }
  #cmdOut { font-family: Consolas, monospace; font-size: 13px; color: #bbb; white-space: pre-wrap; min-height: 18px; max-height: 120px; overflow-y: auto; }
  .box.map { width: min(1100px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  /* 챕터 지도: 한 화면에 메인 챕터 3칸 정도. 마우스로 끌어서 가로로 넘김 (스크롤바는 숨김, 양 끝은 흐리게) */
  .chapter-map {
    overflow-x: auto; overflow-y: hidden; padding: 6px 0 12px; margin-bottom: 6px;
    cursor: grab; user-select: none; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  }
  .chapter-map::-webkit-scrollbar { display: none; }
  .chapter-map.dragging { cursor: grabbing; }
  .chapter-map.dragging .chapter-card { pointer-events: none; }
  .chapter-map .track {
    --gap: 46px; --vgap: 26px;
    /* 카드 너비: 화면 너비로 3.25칸 (양옆이 살짝 보임). 낮은 화면에선 너비는 그대로, 그림 높이만 줄임 */
    --w: max(170px, calc((min(1100px, 100vw - 32px) - 60px - 2 * var(--gap)) / 3.25));
    display: grid; grid-template-columns: repeat(var(--cols), var(--w)); column-gap: var(--gap); row-gap: var(--vgap);
    align-items: center; width: max-content; padding: 0 60px;
  }
  .chapter-map .node { position: relative; display: flex; justify-content: center; }
  .chapter-map .node .chapter-card { width: 100%; }
  .chapter-map .node .thumb { height: auto; aspect-ratio: 16 / 8; }
  .chapter-map .node.side .chapter-card { width: 58%; }
  .chapter-map .node.side .info { padding: 7px 10px; }
  .chapter-map .node.side .info small { font-size: 12px; }
  .chapter-map .node.side .info b { font-size: 16px; }
  .chapter-map .node.main .info { padding: 10px 14px; }
  .chapter-map .node.main .info small { font-size: 14px; }
  .chapter-map .node.main .info b { font-size: 26px; }
  /* 이어지는 선: 메인 → 다음 메인 (가로), 메인 ↔ 외전 (세로) */
  .chapter-map .node.main:not(.last)::after {
    content: ""; position: absolute; left: 100%; top: 50%; width: var(--gap); height: 10px; transform: translateY(-50%);
    background: var(--line, #e9e4f5); border-radius: 2px;
  }
  .chapter-map .node.side::before {
    content: ""; position: absolute; left: 50%; width: 10px; height: var(--vgap); transform: translateX(-50%);
    background: var(--line, #e9e4f5); border-radius: 2px;
  }
  .chapter-map .node.side.top::before { top: 100%; }
  .chapter-map .node.side.bottom::before { bottom: 100%; }
  .map-hint { font-family: "Malgun Gothic", sans-serif; font-size: 14px; color: #8e86a3; margin-bottom: 14px; }
  @media (max-height: 820px) {   /* 낮은 화면: 간격·글자를 줄임 */
    .box.map { padding: 16px 22px; }
    .box.map h2 { font-size: 30px; margin-bottom: 6px; }
    .chapter-map .track { --vgap: 20px; }
    .chapter-map .node.main .info b { font-size: 20px; }
    .chapter-map .node .thumb { aspect-ratio: 21 / 8; }
    .chapter-map .node.side .info { padding: 5px 8px; }
    .chapter-map .node.side .info b { font-size: 14px; }
    .chapter-map .node.main .info { padding: 7px 12px; }
    .map-hint { margin-bottom: 8px; }
  }
  .chapter-card.dev { cursor: not-allowed; border-style: dashed; }
  .chapter-card.dev .thumb {
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: #ffd23a;
    background: repeating-linear-gradient(-45deg, #1d1828 0 14px, #2a2238 14px 28px);
  }
  .chapter-card.locked { filter: grayscale(1) brightness(.55); cursor: not-allowed; }
  .chapter-card.locked:hover { border-color: #3a3150; }
  .chapter-card .lock { display: block; font-size: 13px; color: #ffb03c; margin-top: 2px; }
  .chapter-card .done { color: #7affb0; font-size: 13px; margin-left: 6px; }
  .pause-btns { display: flex; flex-direction: column; gap: 14px; }
  .pause-btns button { font-size: 24px; padding: 12px; }
  .reward { font-family: "Malgun Gothic", sans-serif; font-size: 20px; margin: -12px 0 22px; color: #fff; }
  .reward small { color: #aaa; font-size: 14px; }
  .result-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .result-btns button { font-size: 22px; padding: 12px 26px; }
  .result-btns.win { flex-direction: column; align-items: center; gap: 14px; }
  .result-btns .big { font-size: 40px; padding: 18px 70px; min-width: 420px; }
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 30;
    background: rgba(0, 0, 0, .85); color: #fff; padding: 12px 22px; border-radius: 10px;
    font-family: "Malgun Gothic", sans-serif; font-size: 16px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 타이틀 화면: 1920x1080 기준으로 만들고 화면에 맞게 확대/축소 -->
<div id="menu" class="screen">
  <div class="stage" id="stage">
    <img class="menu-bg" src="assets/ui/menu_bg.jpg" alt="">
    <img class="menu-title" src="assets/ui/title.png" alt="지우현 존@나패기">
    <div class="menu-items">
      <button class="mi" data-act="start">게임 시작</button>
      <button class="mi" data-act="inv">인벤토리</button>
      <button class="mi" data-act="settings">설정</button>
      <button class="mi" data-act="dev">개발자보기</button>
      <button class="mi" data-act="quit">나가기</button>
    </div>
    <div class="menu-load" id="loadMsg">불러오는 중...</div>
  </div>
  <div class="menu-ver">1.0.0</div>
</div>

<!-- 설정 -->
<div id="settings" class="overlay hidden">
  <div class="box">
    <h2>설정</h2>
    <div class="set-row"><span>사운드</span><button id="soundBtn" class="toggle"></button></div>
    <div class="set-row"><span>데이터 초기화<small>얻은 무기, 챕터 진행도가 모두 사라져요</small></span><button id="resetBtn" class="danger">초기화</button></div>
    <div class="set-col">
      <span>개발자 명령어</span>
      <form id="cmdForm"><input id="cmdInput" autocomplete="off" spellcheck="false"><button>실행</button></form>
      <div id="cmdOut"></div>
    </div>
    <button class="back" data-back>← 뒤로</button>
  </div>
</div>

<!-- 챕터 선택 -->
<div id="chapters" class="overlay hidden">
  <div class="box map">
    <h2>챕터 선택</h2>
    <div class="chapter-map" id="chapterMap"><div class="track" id="chapterList"></div></div>

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;
const fmt = n => { const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const rollDamage = d => (Array.isArray(d) ? randInt(d[0], d[1]) : d);
const fontStr = size => `${Math.round(size)}px "Black Han Sans", "Malgun Gothic", sans-serif`;

function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
// 감쇠 스프링: 맞았을 때 출렁이는 움직임에 사용
function spring(o, k, vk, stiff, damp, dt) { o[vk] += (-stiff * o[k] - damp * o[vk]) * dt; o[k] += o[vk] * dt; }

/* =====================================================================
   오디오 (Web Audio로 직접 합성)
   ===================================================================== */
let actx = null, master = null, revIn = null, noiseBuf = null, distCurve = null, muted = false;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC({ latencyHint: 'interactive' });
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 6;
  comp.attack.value = 0.001; comp.release.value = 0.12;
  master = actx.createGain(); master.gain.value = muted ? 0 : 0.9;
  master.connect(comp); comp.connect(actx.destination);

  const len = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;

  const irLen = Math.floor(actx.sampleRate * 1.3);
  const ir = actx.createBuffer(2, irLen, actx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const ch = ir.getChannelData(c);
    for (let i = 0; i < irLen; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.2);
  }
  const conv = actx.createConvolver(); conv.buffer = ir;
  const rg = actx.createGain(); rg.gain.value = 0.45;
  conv.connect(rg); rg.connect(master); revIn = conv;

  distCurve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; distCurve[i] = Math.tanh(x * 5); }
}

function route(node, rev, dist) {
  let n = node;
  if (dist) { const ws = actx.createWaveShaper(); ws.curve = distCurve; ws.oversample = '2x'; n.connect(ws); n = ws; }
  n.connect(master);
  if (rev) { const s = actx.createGain(); s.gain.value = rev; n.connect(s); s.connect(revIn); }
}
function tone(t, o) {
  const osc = actx.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
  const g = actx.createGain(), a = o.attack || 0.002;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + o.dur);
  osc.connect(g); route(g, o.rev, o.dist);
  osc.start(t); osc.stop(t + a + o.dur + 0.05);
}
function noise(t, o) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.8;
  f.frequency.setValueAtTime(o.freq, t);
  if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t + o.dur);
  const g = actx.createGain(), a = o.attack || 0.001;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.gain, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + o.dur);
  src.connect(f); f.connect(g); route(g, o.rev, o.dist);
  src.start(t, Math.random() * 1.5); src.stop(t + a + o.dur + 0.05);
}

function setMuted(m) {
  muted = m;
  if (master) master.gain.value = muted ? 0 : 0.9;
  for (const a of Object.values(loopAudio)) a.muted = muted;
  saveGame();
  renderSettings();
}

const IMG = {};
const crops = new Map();

function loadImages(names, onProgress, onDone) {
  const list = [...new Set(names.filter(Boolean))];
  let done = 0;
  if (!list.length) { onDone(); return; }
  list.forEach(n => {
    const im = new Image();
    im.onload = im.onerror = () => {
      if (im.naturalWidth) IMG[n] = im;
      done++; onProgress(done, list.length);
      if (done === list.length) onDone();
    };
    im.src = encodeURI(n);
  });
}

// 적 사진을 정사각형으로 잘라 둠 (focusY로 세로 위치 조절). 움짤이면 첫 프레임(평소 구간의 첫 프레임)
function cropFor(def) {
  const src = def.anim ? def.anim.sheet : def.img, key = src + '|' + def.focusY;
  if (crops.has(key)) return crops.get(key);
  const S = Math.round(ENEMY_SIZE * Math.min(DPR, 1.5));
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), im = IMG[src];
  if (im && def.anim) {
    const [sx, sy, s] = animRect(def.anim, def.anim.idle ? def.anim.idle[0] : 0, def.focusY);
    g.imageSmoothingQuality = 'high';
    g.drawImage(im, sx, sy, s, s, 0, 0, S, S);
  } else if (im) {
    const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h);
    g.imageSmoothingQuality = 'high';
    g.drawImage(im, (w - s) / 2, (h - s) * (def.focusY ?? 0.5), s, s, 0, 0, S, S);
  } else {
    g.fillStyle = '#333'; g.fillRect(0, 0, S, S);
    g.fillStyle = '#888'; g.font = `${S * 0.06}px sans-serif`; g.textAlign = 'center';
    g.fillText(`이미지 없음: ${src}`, S / 2, S / 2);
  }
  crops.set(key, c);
  return c;
}

function drawCover(im, x, y, w, h) {
  const s = Math.max(w / im.naturalWidth, h / im.naturalHeight);
  const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  ctx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

/* ---------- 미리 그려 두는 캔버스 (매 프레임 비싼 연산을 피하려고) ---------- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

// 배경: 수 MB짜리 원본을 매 프레임 줄여 그리지 않고, 화면 크기에 맞춘 캔버스에 한 번만 그려 둠
// (창 크기 · 챕터 · 렌더 배율이 바뀔 때만 다시 그림). 카메라 흔들림 여백 60px 포함
let bgCache = null;
function bgFor(name) {
  const im = name && IMG[name]; if (!im) return null;
  const key = `${name}|${W}|${H}|${DPR}`;
  if (bgCache && bgCache.key === key) return bgCache.c;
  const c = makeCanvas((W + 120) * DPR, (H + 120) * DPR), g = c.getContext('2d', { alpha: false });
  const s = Math.max(c.width / im.naturalWidth, c.height / im.naturalHeight), dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  g.imageSmoothingQuality = 'high';
  g.drawImage(im, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  bgCache = { key, c };
  return c;
}

// 화면 가장자리 빛(비네트): 색마다 1/4 크기 캔버스에 한 번 그려 두고 늘려서 씀 (부드러운 그라데이션이라 저해상도로 충분)
const glowCache = new Map();
function glowFor(color) {
  const key = `${color}|${W}|${H}`;
  let c = glowCache.get(key);
  if (!c) {
    c = makeCanvas(W / 4, H / 4);
    const g = c.getContext('2d'), w = c.width, h = c.height;
    const gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.hypot(w, h) * 0.6);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(${color},1)`);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (glowCache.size > 24) glowCache.clear();
    glowCache.set(key, c);
  }
  return c;
}

// 빛 번짐 파티클(flash · fire): 원형 그라데이션을 미리 그려 두고 globalAlpha로 흐리게 (파티클마다 그라데이션을 새로 만들지 않음)
function radialSprite(stops) {
  const S = 256, c = makeCanvas(S, S), g = c.getContext('2d'), gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  return c;
}
const SPR = {
  flash: radialSprite([[0, 'rgba(255,255,255,0.95)'], [0.35, 'rgba(255,230,160,0.55)'], [1, 'rgba(255,200,100,0)']]),
  flashBlue: radialSprite([[0, 'rgba(255,255,255,0.95)'], [0.35, 'rgba(140,210,255,0.55)'], [1, 'rgba(255,200,100,0)']]),
  fire: radialSprite([[0, 'rgba(255,250,200,1)'], [0.35, 'rgba(255,170,40,0.8)'], [1, 'rgba(220,40,0,0)']]),
};

// 색이 계속 바뀌는 적(def.hue): ctx.filter는 매 프레임 쓰면 아주 느려서, 색상환을 HUE_STEPS칸으로 나눠
// 미리 칠해 두고(hue-rotate + saturate(1.3)와 같은 색 행렬) 그릴 때는 이웃한 두 장을 섞음
const HUE_STEPS = 12, HUE_SAT = 1.3;
const hueCache = new Map();   // 적 이미지 캔버스 → 칠해 둔 캔버스 HUE_STEPS장
function hueMatrix(deg, s) {
  const a = deg * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
  const h = [
    0.213 + c * 0.787 - n * 0.213, 0.715 - c * 0.715 - n * 0.715, 0.072 - c * 0.072 + n * 0.928,
    0.213 - c * 0.213 + n * 0.143, 0.715 + c * 0.285 + n * 0.140, 0.072 - c * 0.072 - n * 0.283,
    0.213 - c * 0.213 - n * 0.787, 0.715 - c * 0.715 + n * 0.715, 0.072 + c * 0.928 + n * 0.072,
  ];
  const t = [
    0.213 + 0.787 * s, 0.715 - 0.715 * s, 0.072 - 0.072 * s,
    0.213 - 0.213 * s, 0.715 + 0.285 * s, 0.072 - 0.072 * s,
    0.213 - 0.213 * s, 0.715 - 0.715 * s, 0.072 + 0.928 * s,
  ];
  const m = [];   // saturate × hue-rotate (CSS filter 순서대로)
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) m.push(t[i * 3] * h[j] + t[i * 3 + 1] * h[3 + j] + t[i * 3 + 2] * h[6 + j]);
  return m;
}
function hueVariants(src) {
  let list = hueCache.get(src);
  if (list) return list;
  // 미리 칠할 때 한 번만 쓰는 거라 ctx.filter가 되면 그게 제일 빠름 (GPU). 안 되는 브라우저(사파리 등)는 픽셀 계산
  const probe = makeCanvas(1, 1).getContext('2d');
  probe.filter = 'blur(1px)';
  let base = null;
  if (probe.filter !== 'blur(1px)') try { base = src.getContext('2d').getImageData(0, 0, src.width, src.height); } catch (e) {}
  list = [];
  for (let i = 0; i < HUE_STEPS; i++) {
    const deg = (i * 360) / HUE_STEPS, c = makeCanvas(src.width, src.height), g = c.getContext('2d');
    if (base) {
      const m = hueMatrix(deg, HUE_SAT), d = base.data, out = g.createImageData(c.width, c.height), o = out.data;
      for (let p = 0; p < d.length; p += 4) {
        const r = d[p], gg = d[p + 1], b = d[p + 2];
        o[p] = m[0] * r + m[1] * gg + m[2] * b; o[p + 1] = m[3] * r + m[4] * gg + m[5] * b; o[p + 2] = m[6] * r + m[7] * gg + m[8] * b; o[p + 3] = d[p + 3];
      }
      g.putImageData(out, 0, 0);
    } else {
      g.filter = `hue-rotate(${deg}deg) saturate(${HUE_SAT})`;
      g.drawImage(src, 0, 0);
    }
    list.push(c);
  }
  hueCache.set(src, list);
  return list;
}

const canAct = () => !G.paused && G.state === 'fight' && RHs.state !== 'ult';   // 벨 누르는 순간만 못 움직이고, 버스 오는 동안엔 계속 싸움
const enemyX = en => EX + (en ? en.dx + (en.swayX || 0) : 0);
// 맞는 영역: hitbox가 있으면 그 안만, 데칼코마니는 두 장 중 하나
const inEnemy = (x, y, en = curEnemy()) => {
  if (en.def.mirror) return !!mirrorCopyAt(en, x, y);
  if (en.def.hitbox) return inBox(en, en.def.hitbox, x, y);
  return Math.abs(x - enemyX(en)) <= E / 2 && Math.abs(y - EY) <= E / 2;
};

function resize() {
  DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, dprCap));   // 상한 1.5 (프레임이 떨어지면 perf가 더 낮춤)
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  E = Math.max(200, Math.min(ENEMY_SIZE, W - 24, H - BARS_H - 16));
  const top = Math.max(8, (H - E - BARS_H) / 2);
  EX = W / 2; EY = top + BARS_H + E / 2;
}

function addShake(a) { cam.trauma = Math.min(1, cam.trauma + a); }
function setBanner(title, sub, color, max = 1.6, hint = '') { G.banner = { title, sub, color, life: 0, max, hint }; }

/* =====================================================================
   챕터 / 적 진행
   ===================================================================== */
// firstAttack이 있으면 첫 공격만 빨리 옴
function makeEnemy(def) {
  const img = cropFor(def);
  if (!def.anim && (def.hue || (def.phase2 && def.phase2.hue))) hueVariants(img);   // 색 바뀌는 적: 챕터 시작할 때 미리 칠해 둠 (싸우는 중 끊김 방지)
  return {
    def, hp: def.hp, hpChip: def.hp, armor: def.armor || 0, cd: def.firstAttack != null ? Math.max(0, def.cooldown - def.firstAttack) : 0, warned: false, state: 'fight', t: 0, alpha: 1,
    flash: 0, shakeT: 0, shakeA: 0, sq: 0, vsq: 0, rot: 0, vrot: 0, sc: 0, vsc: 0, lean: 0,
    lungeT: -1, lunge: 0, lungeAmt: 1, struck: false, shotsLeft: 0, shotT: 0,
    burstLeft: 0, burstT: 0, fireT: 0, fireTick: 0, fireN: 0, dx: 0, vdx: 0,
    escX: 0, escY: 0, stepN: 0, img,
  };
}

// cp: 보스전 체크포인트 { idx, heals } — 있으면 그 적부터, 그때 힐템 개수로 시작
function startChapter(i, cp) {
  stopUlt();
  G.chapter = i;
  const ch = chapter();
  hueCache.clear();   // 이전 챕터에서 칠해 둔 색 바뀜 이미지는 메모리에서 비움
  G.enemies = ch.enemies.map(makeEnemy); G.idx = cp ? cp.idx : 0;
  player.heals = cp ? { ...cp.heals } : healKit();
  G.checkpoint = cp || null; G.itemShown = false; G.unlocks = []; G.newHeals = null;
  Object.assign(P, { hp: maxHp(), guarding: false, guardT: 0, guardCd: 0, guardCdMax: 1, bonus: 0, atkT: 99, flinch: 0, vflinch: 0, counterT: 0, counterCd: 0, poseT: 0 });
  RHs.state = 'idle'; LHs.state = 'idle';
  parts.length = 0; texts.length = 0; notes.length = 0; buffered = null;
  Object.assign(G, {
    state: 'intro', introT: 2.2, hitStop: 0, combo: 0, comboT: 0, maxCombo: 0,
    dealt: 0, taken: 0, startTime: G.time, hurtT: 0, blockT: 0, focus: null, endT: 0,
  });
  clearBullets(); G.swings = []; P.iframe = 0;
  resetCursor(); G.dm = null; G.cutFlash = 0;
  G.tut = ch.tutorial ? { step: 0, hits: 0, blocks: 0, counters: 0, inv: false, flash: 0 } : null;
  setBanner(ch.label, ch.name, '#ffd23a', 2.2);
  SFX.start();
}

function announceEnemy(en) {
  // 이름이 떠 있는 동안은 나도 적도 공격하지 않음
  const big = en.def.boss || en.def.midboss, hint = en.def.hint || '', t = hint ? 2.4 : big ? 1.6 : 1.3;
  // 체크포인트: 보스 (midRetry면 중간 보스도). 더 뒤의 체크포인트에 오면 바꿈
  const ch = chapter(), cpHere = ch.bossRetry && (en.def.boss || (ch.midRetry && en.def.midboss));
  if (cpHere && (!G.checkpoint || G.checkpoint.idx < G.idx)) G.checkpoint = { idx: G.idx, heals: { ...player.heals }, label: en.def.boss ? '보스전부터 다시' : '중간 보스부터 다시' };
  resetCursor(); discordPost(en);
  if (en.def.boss) { setBanner('BOSS', en.def.name, '#ff3b3b', t, hint); SFX.boss(); }
  else if (en.def.midboss) { setBanner('MID BOSS', en.def.name, '#ff9a3c', t, hint); SFX.boss(); }
  else setBanner(en.def.name, '', '#ffd0e8', t, hint);
  G.state = 'announce'; G.introT = t;
  buffered = null;
}

function nextEnemy() {
  if (G.state === 'dead') return;
  G.idx++;
  const en = curEnemy();
  if (en) announceEnemy(en);
  else chapterClear(chapter().tutorial ? '튜토리얼 완료!' : '우현을 쓰러뜨렸다!');
}

// 튜토리얼 단계: 조건을 채우면 다음 단계로
const TUT_STEPS = [
  { text: '좌클릭으로 우현을 때려보세요', need: 3, count: t => t.hits },
  { text: '공격 게이지가 차면 우현이 때려요. 우클릭을 누르고 있으면 가드! 공격을 막아보세요', need: 1, count: t => t.blocks },
  { text: '막으면 다음 주먹이 세져요 (주먹 고유 능력). 바로 반격하세요!', need: 1, count: t => t.counters },
  { text: 'I 키로 인벤토리를 열어보세요. 힐템은 더블클릭이나 F로 먹어요', need: 1, count: t => (t.inv ? 1 : 0) },
  { text: '좋아요! 이제 우현을 쓰러뜨려 보세요', need: 0, count: () => 0 },
];
function updateTutorial(rdt) {
  const t = G.tut, st = TUT_STEPS[t.step];
  t.flash = Math.max(0, t.flash - rdt * 2);
  if (st.need && st.count(t) >= st.need && t.step < TUT_STEPS.length - 1) {
    t.step++; t.flash = 1;
    t.blocks = 0; t.counters = 0;   // 단계마다 새로 세기
    SFX.ready();
  }
}
function drawTutorial() {
  const t = G.tut;
  if (!t || (G.state !== 'fight' && G.state !== 'announce')) return;
  const st = TUT_STEPS[t.step], w = Math.min(760, W - 40), h = 64;
  const x = W / 2 - w / 2, y = Math.max(76, EY - E / 2 - BARS_H - h - 10);
  ctx.save();
  ctx.fillStyle = 'rgba(10,8,18,0.82)'; rr(ctx, x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = t.flash > 0 ? `rgba(122,255,176,${0.4 + t.flash * 0.6})` : 'rgba(255,210,58,0.6)';
  ctx.lineWidth = 2 + t.flash * 3; ctx.stroke();
  ctx.font = fontStr(15); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = '#ffd23a';
  ctx.fillText(`튜토리얼 ${t.step + 1} / ${TUT_STEPS.length}`, x + 16, y + 9);
  if (st.need > 1) { ctx.textAlign = 'right'; ctx.fillText(`${Math.min(st.count(t), st.need)} / ${st.need}`, x + w - 16, y + 9); }
  ctx.font = '600 18px "Malgun Gothic", sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(st.text, x + 16, y + 34, w - 32);
  ctx.restore();
}

function chapterClear(sub) {
  G.state = 'clear'; G.endT = 2.2;
  G.hpUp = !isCleared(chapter().id) && hpRewardOf(chapter());   // 처음 깬 챕터면 최대 체력 + (보통 50, 챕2는 100)
  G.newHeals = !isCleared(chapter().id) && chapter().healReward || null;
  const locked = CHAPTERS.filter(c => !isUnlocked(c));
  G.newWeapon = markCleared(chapter());
  G.unlocks = locked.filter(isUnlocked);   // 이번 클리어로 새로 열린 챕터
  setBanner(chapter().tutorial ? 'CLEAR' : 'CHAPTER CLEAR', sub, '#7affb0', 2.4);
  SFX.clear();
}

// 공격 종류: 기본(한 방) / shots>1(연속 공격) / 'notes'(음표 연사) / 'fire'(불 뿜기)
const FIRE_TICK = 0.1;
function startAttack(en) {
  const d = en.def, ai = d.ai && AI[d.ai];
  if (ai && ai.attack) { ai.attack(en); return; }
  if (d.attack === 'notes') { en.lungeT = 0; en.struck = true; en.shotsLeft = d.shots || 3; en.shotT = 0.12; en.lungeAmt = 0.5; }
  else if (d.attack === 'fire') { en.fireT = d.fireTime || 2; en.fireTick = 0; en.fireN = 0; SFX.fire(en.fireT); }
  else if (d.attack === 'pattern') startPattern(en);
  else if (d.panic) startPanic(en);
  else if (d.rage) {   // 화나서 3~5연타, 총 피해는 고정이라 많이 때릴수록 한 대는 약함
    // 한 대 한 대가 피규어 베기 (보스 패턴과 같은 부채꼴). 다 카운터해도 기절은 없음
    const n = randInt(d.rage.min, d.rage.max), p = { countered: 0, resolved: 0, total: n, noStun: true }, d0 = pick([1, -1]);
    for (let i = 0; i < n; i++) spawnSweep(p, i % 2 ? -d0 : d0, i * d.rage.every, d.rage.tele, d.rage.total / n);
    texts.push({ str: `${n}연타!`, x: enemyX(en), y: EY - E * 0.42, vx: 0, vy: -50, size: 54, life: 0, max: 0.7, rot: rand(-0.15, 0.15), c1: '#ffffff', c2: '#ff3b3b' });
  }
  else { en.burstLeft = d.shots || 1; en.burstDmg = null; en.burstT = 0; en.lungeAmt = 1; }
}

function defeat(en) {
  notes.length = 0; en.lungeT = -1; en.lunge = 0; en.shotsLeft = 0; en.burstLeft = 0; en.fireT = 0; en.run = 0; en.pat = null;
  clearBullets();
  if (en.def.door) {   // 문: 체력이 다 닳으면 fuse초 동안 부들부들 → 폭발 (그 사이에 카운터로 막아야 함)
    en.state = 'fuse'; en.t = 0; en.flash = 1; en.shakeT = en.def.door.fuse; en.shakeA = 18;
    return;
  }
  if (en.def.boss) {
    en.state = 'escape'; en.t = 0; en.stepN = 0;
    SFX.surprise();
    texts.push({ str: '!?', x: EX + E * 0.25, y: EY - E * 0.3, vx: 0, vy: -40, size: 130, life: 0, max: 0.9, rot: 0.15, c1: '#ffffff', c2: '#ffd23a' });
  } else {
    en.state = 'out'; en.t = 0;   // 사진이 사라지고 뒤에 겹쳐 있던 다음 우현이 드러남
    SFX.vanish();
  }
}

function doorBlast(en) {
  G.whiteT = 0.55; addShake(1); cam.vkz += 3; G.fireGlow = 1;
  impactFx(EX, EY, true);
  for (let i = 0; i < 70; i++) {
    const a = rand(0, TAU), sp = rand(300, 1500);
    addPart({ t: 'fire', x: EX + rand(-E / 3, E / 3), y: EY + rand(-E / 3, E / 3), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(24, 50), life: 0, max: rand(0.6, 1.1) });
  }
  SFX.boom();
  en.state = 'out'; en.t = 0;
  hurtPlayer(en.def.door.blast);
}

const ESC_HOP = 0.4, ESC_RUN = 1.3;

function updateEnemy(en, dt, rdt) {
  spring(en, 'sq', 'vsq', 380, 14, dt);
  spring(en, 'rot', 'vrot', 200, 12, dt);
  spring(en, 'sc', 'vsc', 260, 14, dt);
  spring(en, 'dx', 'vdx', 160, 13, dt);   // 회피할 때 옆으로 피했다 돌아옴
  en.flash = Math.max(0, en.flash - rdt * 7);
  en.shakeT = Math.max(0, en.shakeT - rdt);
  if (en.hpChip > en.hp) en.hpChip = Math.max(en.hp, en.hpChip - en.def.hp * 0.8 * dt);

  if (en.state === 'out') {
    en.t += dt; en.alpha = 1 - clamp(en.t / 0.25, 0, 1);
    if (en.t >= 0.25) nextEnemy();
    return;
  }
  if (en.state === 'fuse') {   // 문: 터지기 직전 (히트스톱과 상관없이 실제 시간으로 셈)
    en.t += rdt; en.flash = Math.max(en.flash, 0.6);
    if (en.t >= en.def.door.fuse) doorBlast(en);
    return;
  }
  if (en.state === 'escape') {   // 보스: 깜짝 놀라 펄쩍 → 오른쪽으로 도망
    en.t += dt;
    const t = en.t;
    if (t < ESC_HOP) {
      en.escY = -Math.sin((t / ESC_HOP) * Math.PI) * 50;
    } else {
      const q = Math.min(1, (t - ESC_HOP) / ESC_RUN), ph = (t - ESC_HOP) * 14;
      en.escX = q * q * (W / 2 + E * 0.75);
      en.escY = -Math.abs(Math.sin(ph)) * 30;
      en.lean = lerp(en.lean, 0.12, 1 - Math.exp(-dt * 10));
      const n = Math.floor(ph / Math.PI);
      if (n > en.stepN && q < 1) {
        en.stepN = n; SFX.step();
        for (let i = 0; i < 4; i++) addPart({ t: 'dust', x: EX + en.escX - E * 0.2 + rand(-40, 40), y: EY + E / 2 - 10, vx: rand(-260, -80), vy: rand(-90, -20), r: rand(12, 24), life: 0, max: rand(0.4, 0.6) });
      }
    }
    if (t >= ESC_HOP + ESC_RUN + 0.1 && G.state === 'fight') chapterClear(`${chapter().name} — 우현이 도망쳤다!`);
    return;
  }
  if (G.state !== 'fight') return;   // 인트로 중엔 공격 게이지 멈춤
  if (en.stunT > 0) {   // 기절: 아무것도 안 함
    en.stunT -= dt;
    en.rot = Math.sin(G.time * 6) * 0.06;
    if (en.stunT <= 0) { en.stunT = 0; en.cd = 0; en.warned = false; texts.push({ str: '정신 차림', x: EX, y: EY - E * 0.42, vx: 0, vy: -40, size: 40, life: 0, max: 0.8, rot: 0, c1: '#ffffff', c2: '#ff6b6b' }); }
    return;
  }

  // sway: 버스처럼 좌우로 흔들림 → 따라가면서 때려야 함
  const sw = en.def.sway;
  if (sw) { en.swayT = (en.swayT || 0) + dt; en.swayX = Math.sin(en.swayT * sw.speed) * sw.amp * E; }
  else en.swayX = 0;
  // regen: 한동안 안 맞으면 쿨쿨 자면서 체력 회복
  const rg = en.def.regen;
  en.idleT = (en.idleT || 0) + dt;
  if (rg && en.idleT >= rg.delay && en.hp < en.def.hp) {
    en.hp = Math.min(en.def.hp, en.hp + rg.perSec * dt);
    en.hpChip = Math.max(en.hpChip, en.hp);
    en.zzzT = (en.zzzT || 0) - dt;
    if (en.zzzT <= 0) {
      en.zzzT = 0.45;
      texts.push({ str: pick(['Z', 'z', 'Zz']), x: enemyX(en) + E * rand(0.15, 0.4), y: EY - E * rand(0.1, 0.35), vx: rand(10, 40), vy: -90, size: rand(40, 64), life: 0, max: 0.9, rot: rand(-0.3, 0.3), c1: '#ffffff', c2: '#8fd0ff' });
      texts.push({ str: `+${fmt(rg.perSec * 0.45)}`, x: enemyX(en) - E * 0.3, y: EY - E * 0.38, vx: 0, vy: -50, size: 26, life: 0, max: 0.6, rot: 0, c1: '#eaffea', c2: '#3ddc84' });
    }
  }

  const ai = en.def.ai && AI[en.def.ai];
  if (ai && ai.update) ai.update(en, dt);

  if (en.lungeT >= 0) {
    en.lungeT += dt;
    const t = en.lungeT, sa = en.strikeAt || 0.08;   // sa: 공격 시작부터 맞는 순간까지
    en.lunge = (t < sa ? Math.pow(t / sa, sa > 0.2 ? 3 : 1) : Math.max(0, 1 - (t - sa) / 0.2)) * en.lungeAmt;
    if (t >= sa && !en.struck) {
      en.struck = true;
      if (en.def.charge || sa > 0.4) SFX.heavy();   // 달려와서 박는 '퍽'
      hurtPlayer(en.strikeDmg != null ? en.strikeDmg : rollDamage(en.def.damage));
    }
    if (t >= sa + 0.2) { en.lungeT = -1; en.lunge = 0; }
  }
  if (en.burstLeft > 0) {   // 한 방 또는 연속 공격 (2점사, 3점사 …)
    en.burstT -= dt;
    if (en.burstT <= 0) {
      en.lungeT = 0; en.struck = false; en.burstLeft--;
      en.strikeAt = en.def.strikeAt || 0.08; en.strikeDmg = en.burstDmg;
      en.burstT = en.def.rage ? rand(0.3, 0.62) : 0.32;   // 개빡우현은 불규칙하게
      if (en.def.swingImg) { G.swings.push({ img: en.def.swingImg, side: pick([-1, 1]), t: 0, strike: en.strikeAt, dur: en.strikeAt + 0.22 }); SFX.whoosh(); }
    }
  }
  if (en.shotsLeft > 0) {
    en.shotT -= dt;
    if (en.shotT <= 0) { fireNote(en, (en.def.shots || 3) - en.shotsLeft); en.shotsLeft--; en.shotT = 0.24; }
  }
  if (en.fireT > 0) {   // 불 뿜기: fireTime 동안 총 damage를 잘게 나눠서
    en.fireT -= dt; en.fireTick -= dt;
    en.lunge = lerp(en.lunge, 0.35, 1 - Math.exp(-dt * 12));
    const [fx, fy] = en.def.fireFrom || [0.5, 0.35];
    const mx = EX - E / 2 + fx * E, my = EY - E / 2 + fy * E;
    for (let i = 0; i < 3; i++) {
      const tx = W / 2 + rand(-0.35, 0.35) * W, ty = H * 0.75 + rand(-0.2, 0.15) * H, sp = rand(1.7, 2.3);
      addPart({ t: 'fire', x: mx, y: my, vx: (tx - mx) * sp, vy: (ty - my) * sp, r: rand(20, 36), life: 0, max: rand(0.45, 0.7) });
    }
    G.fireGlow = 1;
    if (en.fireTick <= 0) {
      en.fireTick += FIRE_TICK;
      const ticks = Math.round((en.def.fireTime || 2) / FIRE_TICK);
      hurtPlayer(rollDamage(en.def.damage) / ticks, true, en.fireN % 4 === 0);
      en.fireN++;
    }
    if (en.fireT <= 0) en.lunge = 0;
  }
  // 달려오는 적: 쿨타임이 찰수록 가까워지고(커지고) 뛰는 소리
  if (en.def.charge) {
    const busy = en.lungeT >= 0 || en.burstLeft > 0;
    en.run = busy ? 0 : clamp(en.cd / en.def.cooldown, 0, 1);
  }
  if (G.tut && (G.tut.step === 0 || G.tut.step === 3)) return;   // 튜토리얼: 공격·인벤토리 연습 중엔 적이 안 때림
  if (en.def.door) return;                                    // 문은 공격 안 함
  if (en.pat) { updatePattern(en, dt); return; }              // 탄막 패턴 중엔 쿨타임 멈춤
  // 공격 중(연타·음표·불·날아오는 딸기)엔 쿨타임 멈춤 → 공격이 다 끝나고 나서 다시 참
  if (en.busy || en.lungeT >= 0 || en.burstLeft > 0 || en.shotsLeft > 0 || en.fireT > 0 || notes.length || bullets.some(b => b.k === 'berry' || b.k === 'sweep')) return;
  en.cd += dt;
  if (!en.warned && en.def.cooldown > 0.7 && en.def.cooldown - en.cd <= 0.7) { en.warned = true; SFX.warn(); }
  if (en.cd >= en.def.cooldown) { en.cd = 0; en.warned = false; startAttack(en); }
}

const NOTE_GLYPHS = ['♪', '♫', '♬', '♩'];
const NOTE_COLORS = ['#ff6bd6', '#7ad7ff', '#ffe27a'];

function fireNote(en, i) {
  const [fx, fy] = en.def.noteFrom || [0.5, 0.3];
  const sx = enemyX(en) - E / 2 + fx * E, sy = EY - E / 2 + fy * E, gl = en.def.glyphs || NOTE_GLYPHS;
  notes.push({
    sx, sy, x: sx, y: sy, s: 0.45,

/* ---------- 하차벨 연출 ----------

   bell : 벨 소리가 끝날 때까지 대기

function ultAudio(src) { preloadSounds([src]); const a = sfxFiles[src]; a.currentTime = 0; a.muted = muted; a.volume = 1; a.play().catch(() => {}); return a; }
function startUlt() {

function updateUlt(dt) {

  if (RHs.state === 'ult' && RHs.t >= d.frames[d.frames.length - 1].until) {
    // 1회용: 무기 사라지고 기본 주먹으로
    player.weapons = player.weapons.filter(id => WEAPONS[id] !== weapon() || id === DEFAULT_WEAPON);
    player.equipped = null; saveGame();

// tick: 불 뿜기처럼 짧게 여러 번 들어오는 피해 → 반응을 작게, 소리는 sfx일 때만

/* ---------- 보스 탄막 패턴 (언더테일 오마주) ---------- */
// 패턴별 피해량 (난이도 조절은 여기서)
const PDMG = { noodle: 10, drop: 8, snipe: 12, beam: 18, rush: 16, fig: 20 };
function noodleRow(p) {   // 면발 벽: 틈 하나로만 빠져나갈 수 있음
  const gapW = 250, step = 34;   // 면발 간격이 좁아서 틈으로만 통과 가능
  p.gap = clamp(p.gap + rand(-0.2, 0.2), 0.1, 0.9);   // 틈이 한 번에 너무 멀리 가지 않게
  p.ph = rand(0, TAU);   // 한 줄은 같이 출렁임 (틈 모양 유지)
  const gx = p.gap * W;
  for (let x = step / 2; x < W; x += step) {
    if (Math.abs(x - gx) < gapW / 2) continue;
    bullets.push({ k: 'noodle', x: x + rand(-4, 4), y: -170 - rand(0, 24), vy: p.speed, len: 150, ph: p.ph, dmg: PDMG.noodle });
  }
}
function dropRing(en, i) {   // 국물 방울이 둥글게 퍼짐
  const n = 14, ox = enemyX(en), oy = EY - E * 0.05, off = (i % 2) * Math.PI / n + rand(-0.12, 0.12);
  for (let k = 0; k < n; k++) {
    const a = off + (k / n) * TAU;
    bullets.push({ k: 'drop', x: ox, y: oy, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, r: 14, dmg: PDMG.drop, t: 0 });
  }
  SFX.noteHit();
}
function snipe(speed, dmg) {   // 마우스 위치를 노리고 0.35초 뒤 발사 (조준점이 먼저 보임)
  addBerry({ from: rand(0, TAU), speed, dmg, spread: 0, aimX: mouse.x, aimY: mouse.y, delay: 0.35, warn: 0.35, mark: true });
}
function fireBeam(en, dmg) {   // 가스터 블래스터 오마주: 경고선 → 굵은 빔
  const dirs = [[1, 0], [0, 1], [0.7071, 0.7071], [0.7071, -0.7071]], [dx, dy] = pick(dirs);
  bullets.push({ k: 'beam', cx: mouse.x, cy: mouse.y, dx, dy, w: 120, warn: 0.7, fire: 0.3, t: 0, dmg, fired: false, img: en.img });

}
function rush(en) {   // 돌진: 0.55초 예고 후 박치기 → 가드/카운터 타이밍
  en.lungeT = 0; en.struck = false; en.strikeAt = 0.55; en.strikeDmg = PDMG.rush; en.lungeAmt = 2.4;

function figureVolley(aimT, stagger, speed) {

// 1) 피규어 베기: 큰 피규어가 한쪽에 나타났다가(예고) 반대쪽으로 부채꼴 '잔상'만 남기며 벰.
//    부채꼴 안에 마우스가 있으면 100. 4번 다 카운터하면 기절
//    빨간 예고 → 베기 0.3초 전부터 흰 점선(고정) → 벰. 미쿠 미사일과 같은 반응 시간
const SWEEP_DMG = 100, SWEEP_GAP = 0.3;
// huge: 주황/파랑 휘두르기 — 화면 전체를 덮을 만큼 커서 범위 밖으로 피할 수 없음
const sweepGeom = (huge = false) => huge
  ? { px: W / 2, py: H + 20, R: Math.hypot(W / 2, H + 20) * 1.08, a0: 0.02, a1: -Math.PI - 0.02 }
  : { px: W / 2, py: H + 20, R: Math.min(H * 0.78, W * 0.6), a0: -0.12, a1: -Math.PI + 0.12 };
// color: 'orange'(움직이고 있어야 안 맞음) / 'blue'(가만히 있어야 안 맞음) — 언더테일 주황·파랑 공격
function spawnSweep(p, dir, delay, tele, dmg = SWEEP_DMG, color = null) { bullets.push({ k: 'sweep', p, dir, delay, wind: tele + SWEEP_GAP, t: 0, locked: false, done: false, dmg, color }); }
const MOVE_V = 40;   // 이 속도(px/초)보다 빠르면 '움직이는 중'
function inSweep(x, y) {
  const g = sweepGeom(), dx = x - g.px, dy = y - g.py, a = Math.atan2(dy, dx);
  return Math.hypot(dx, dy) <= g.R && a <= g.a0 && a >= g.a1;
}
// 2) 미쿠 미사일: 양쪽 가장자리 3개씩 0.5초 락온 → 경로 고정 0.3초(흰 점선) → 발사를 3번 반복. 카운터 2번 성공하면 기절 → 히트스캔 (개당 45, 한번에 맞음). 카운터하면 기절
const MSL_DMG = 45, MSL_LOCK = 0.5, MSL_GAP = 0.3, MSL_VOLLEYS = 3, MSL_NEXT = 0.35;   // 경로 고정(흰 점선) 후 0.3초 뒤 발사, 3연사 (발사 후 MSL_NEXT초 뒤 다음 조준)
function spawnMissiles(p) {

}
function mslHead(b) { const im = IMG[WOOWP], h = (im ? im.naturalHeight : 800) * WP_S; return { x: b.x + Math.sin(b.ang) * h / 2, y: b.y - Math.cos(b.ang) * h / 2 }; }
// 3) 딸기 섭취: 라면 냄비에서 딸기가 튀어나옴 → 0.75초 안에 못 때리면 500 회복

// 4) 미쿠 피규어 흘리기: 양옆 빈 공간에 떨어짐 → 때리면 5초 기절

/* ---------- 챕3 보스: 거대 미쿠빔 (샌즈 가스터 블래스터 오마주). 전부 카운터 불가 ---------- */
const GB_DMG = 200;
// 카운터를 무시하는 피해 (가드는 됨). b.grp가 있으면 같은 공격 묶음에선 한 번만 맞음 (사각형·X: 총 200)
function hardHit(dmg, b) {
  if (G.state !== 'fight') return;
  const grp = b && b.grp;
  if (grp) { if (grp.hit) return; grp.hit = true; }
  else if (P.iframe > 0) return;
  P.iframe = IFRAME;
  hurtPlayer(dmg, false, true, true);
}
// 빔 하나: (ox, oy)에서 ang 방향으로, 굵기 w. warn초 기다렸다가 쏨 (판정은 쏘는 순간 한 번, 빔은 fire초 동안 보임)
// full: 화면을 가로지르는 띠 (뒤쪽까지 판정) / fx, fy: 미쿠 머리 위치 (기본은 시작점) / size: 미쿠 크기(세로 px)
function spawnGB(o) {
  bullets.push({ k: 'gb', under: true, t: 0, fire: 0.5, dmg: GB_DMG, full: true, ...o, upd: updGB, draw: drawGB, drawTop: drawGBMiku });
}
function gbHead(b) {   // 미쿠 머리 위치 (처음 0.25초 동안 뒤에서 쑥 나옴)
  const ux = Math.cos(b.ang), uy = Math.sin(b.ang), e = easeOutCubic(clamp(b.t / 0.25, 0, 1)), recoil = b.t >= b.warn && b.t < b.warn + b.fire ? 18 : 0;
  return { x: (b.fx ?? b.ox) - ux * ((1 - e) * b.size + recoil), y: (b.fy ?? b.oy) - uy * ((1 - e) * b.size + recoil), ux, uy };
}
function updGB(b, dt, mx, my, live) {
  const firing = b.t >= b.warn && b.t < b.warn + b.fire;
  const shot = firing && !b.fired;   // 쏘는 그 순간 (판정은 이때 한 번만. 빔이 사라지는 중엔 안 맞음)
  if (shot) { b.fired = true; SFX.beam(); SFX.boom(); addShake(0.55); }
  if (live && shot) {
    const ux = Math.cos(b.ang), uy = Math.sin(b.ang), dx = mx - b.ox, dy = my - b.oy;
    if (Math.abs(dx * uy - dy * ux) < b.w / 2 && (b.full || dx * ux + dy * uy > 0)) hardHit(b.dmg, b);
  }
  if (b.t >= b.warn + b.fire + 0.25) return false;
}
function drawGB(b) {
  const L = Math.hypot(W, H) * 1.5, back = b.full ? L : 0, t = b.t, end = b.warn + b.fire;
  ctx.save(); ctx.translate(b.ox, b.oy); ctx.rotate(b.ang);
  if (t < b.warn) {   // 예고: 빔 자리가 빨갛게 깜빡 → 쏘기 직전엔 더 진하게 (흰색은 카운터 가능한 공격에만 씀)
    const lock = b.warn - t <= 0.25;
    ctx.globalAlpha = lock ? 0.2 : 0.06 + 0.05 * Math.sin(G.rt * 20); ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(-back, -b.w / 2, L + back, b.w);
    ctx.globalAlpha = 1; ctx.setLineDash([22, 14]); ctx.lineWidth = lock ? 5 : 2; ctx.strokeStyle = lock ? '#ff2a3d' : 'rgba(255,60,60,0.75)';
    ctx.beginPath(); ctx.moveTo(-back, -b.w / 2); ctx.lineTo(L, -b.w / 2); ctx.moveTo(-back, b.w / 2); ctx.lineTo(L, b.w / 2); ctx.stroke();
  } else if (t < end + 0.25) {   // 빔: 확 커졌다가 → 살짝 가늘어지고 → 사라짐
    const q = (t - b.warn) / b.fire;

      } else {   // 벤 뒤: 부채꼴 잔상만
        const k = 1 - (b.t - b.wind) / 0.45;
        ctx.save(); ctx.globalAlpha = 0.35 * k; ctx.fillStyle = tint || '#ffffff';
        ctx.beginPath(); ctx.moveTo(g.px, g.py); ctx.arc(g.px, g.py, g.R, g.a1, g.a0); ctx.closePath(); ctx.fill(); ctx.restore();
        for (let j = 0; j <= 8; j++) drawFig(lerp(aStart, aEnd, j / 8), k * (0.15 + 0.45 * (j / 8)), tint);
      }
    } else if (b.k === 'msl') {
      const im = IMG[WOOWP]; if (!im) continue;
      const w = im.naturalWidth * WP_S, h = im.naturalHeight * WP_S, hd = mslHead(b);
      ctx.save();
      if (!b.locked) {   // 락온 중: 마우스를 따라가는 점선
        const left = MSL_LOCK - b.p.vt;
        ctx.setLineDash([16, 12]); ctx.lineWidth = 2;
        ctx.strokeStyle = `rgba(255,40,60,${clamp(0.3 + (1 - left / MSL_LOCK) * 0.6, 0, 0.9)})`;
        ctx.beginPath(); ctx.moveTo(hd.x, hd.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      } else {
        const dx = b.tx - b.lx, dy = b.ty - b.ly, L = Math.hypot(dx, dy) || 1, ex = b.lx + dx / L * 4000, ey = b.ly + dy / L * 4000;
        if (!b.shot) {   // 경로 고정: 흰 점선 (발사까지 MSL_GAP초)
          ctx.setLineDash([22, 14]); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12;
          ctx.beginPath(); ctx.moveTo(b.lx, b.ly); ctx.lineTo(ex, ey); ctx.stroke();
        } else {   // 히트스캔 발사
          const k = 1 - b.shotT / 0.5;
          ctx.globalAlpha = k; ctx.shadowColor = '#ff8ad8'; ctx.shadowBlur = 30;
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 60 * k + 12;
          ctx.beginPath(); ctx.moveTo(b.lx, b.ly); ctx.lineTo(ex, ey); ctx.stroke();
        }
      }
      ctx.restore();
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
      ctx.shadowColor = b.locked ? '#ffffff' : 'rgba(255,40,60,0.9)'; ctx.shadowBlur = 22;
      if (b.shot) ctx.globalAlpha = clamp(1 - b.shotT / 0.5, 0, 1);
      ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
    } else if (b.k === 'hb') {   // 냄비에서 튀어나오는 딸기 + 남은 시간 원
      const im = IMG[BERRY]; if (!im) continue;
      const pop = easeOutBack(clamp(b.t / 0.2, 0, 1)), w = im.naturalWidth * 0.6 * pop, h = im.naturalHeight * 0.6 * pop;
      ctx.save(); ctx.drawImage(im, b.x - w / 2, b.y - h / 2 - 20 * pop, w, h);
      ctx.strokeStyle = '#3ddc84'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(b.x, b.y - 20, 80, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - b.t / HEAL_TIME)); ctx.stroke(); ctx.restore();
      outlinedText('때려!', b.x, b.y - 120, 40, 'center', 'middle', '#ffffff', '#3ddc84');
    } else if (b.k === 'mk') {   // 떨어뜨린 미쿠 피규어
      const im = IMG[WOOWP]; if (!im) continue;
      const w = im.naturalWidth * WP_S, h = im.naturalHeight * WP_S;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot + Math.sin(b.t * 3) * 0.05);
      ctx.shadowColor = '#ff8ad8'; ctx.shadowBlur = 26;
      ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
    } else if (b.k === 'fig') {
      const im = IMG[WOOWP]; if (!im) continue;
      const w = im.naturalWidth * WP_S, h = im.naturalHeight * WP_S;
      if (!b.fired) {   // 조준선: 발사가 가까울수록 진해지고, 직전엔 하얗게 번쩍
        const left = b.fireAt - b.t, hx = b.x + Math.sin(b.ang) * h / 2, hy = b.y - Math.cos(b.ang) * h / 2;
        ctx.save(); ctx.setLineDash([16, 12]);
        ctx.strokeStyle = left < 0.3 ? '#ffffff' : `rgba(255,40,60,${clamp(0.25 + (1 - left / b.fireAt) * 0.6, 0, 0.85)})`;
        ctx.lineWidth = left < 0.3 ? 4 : 2;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); ctx.restore();
      }
      const ghosts = b.fired ? 3 : 0;
      for (let k = ghosts; k >= 0; k--) {
        ctx.save(); ctx.globalAlpha = k ? 0.18 : 1;
        ctx.translate(b.x - b.vx * 0.012 * k, b.y - b.vy * 0.012 * k); ctx.rotate(b.ang);
        ctx.shadowColor = !b.fired && b.fireAt - b.t < 0.3 ? '#ffffff' : 'rgba(255,40,60,0.9)'; ctx.shadowBlur = 22;
        ctx.drawImage(im, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
    } else if (b.k === 'wp') {
      if (b.delay > 0) continue;
      const im = IMG[WOOWP]; if (!im) continue;
      const w = im.naturalWidth * WP_S, h = im.naturalHeight * WP_S;
      let x = b.x, y = b.y + Math.sin(b.t * 3) * 6;
      if (b.shake > 0) { x += rand(-6, 6); y += rand(-6, 6); }
      ctx.save(); ctx.translate(x, y); ctx.rotate(b.rot);
      ctx.shadowColor = 'rgba(57,197,187,0.9)'; ctx.shadowBlur = 18;
      ctx.drawImage(im, -w / 2, -h / 2, w, h);
      if (b.flash > 0) { ctx.globalAlpha = b.flash; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(im, -w / 2, -h / 2, w, h); }
      ctx.restore();
    }
  }
}

/* =====================================================================
   CHAPTER 2 외전 (gifs): 움짤 적 · 게임 속 커서 · 적마다 다른 행동 · 새 패턴
   ===================================================================== */

/* ---------- 움짤 (프레임 시트) ---------- */
// f번 프레임을 정사각형으로 자른 영역 [sx, sy, s] (focusY로 세로 위치)
function animRect(anim, f, focusY) {
  const s = Math.min(anim.fw, anim.fh), k = ((Math.floor(f) % anim.n) + anim.n) % anim.n;
  return [(k % anim.cols) * anim.fw + (anim.fw - s) / 2, Math.floor(k / anim.cols) * anim.fh + (anim.fh - s) * (focusY ?? 0.5), s];
}
// 지금 보여줄 프레임: 공격 중이면 en.frame, 아니면 idle 구간(없으면 전체)을 fps로 반복
function enemyFrame(en) {
  const a = en.def.anim;
  if (en.frame != null) return en.frame;
  if (a.idle) return a.idle[0] + Math.floor(G.time * a.fps) % (a.idle[1] - a.idle[0]);
  return Math.floor(G.time * a.fps);
}
// 적 그림 한 장 (움짤이면 지금 프레임, hue면 색이 계속 바뀜)
function drawEnemyImg(en, x, y, size) {
  const d = en.def, a = d.anim, sheet = a && IMG[a.sheet];
  if (d.hue && !sheet) {   // 미리 칠해 둔 색 중 이웃한 두 장을 섞어서 부드럽게 (ctx.filter 안 씀)
    const v = hueVariants(en.img), f = ((((G.rt * d.hue) % 360) + 360) % 360) / 360 * HUE_STEPS, i0 = Math.floor(f) % HUE_STEPS, k = f - Math.floor(f);
    ctx.drawImage(v[i0], x, y, size, size);
    if (k > 0.02) { const ga = ctx.globalAlpha; ctx.globalAlpha = ga * k; ctx.drawImage(v[(i0 + 1) % HUE_STEPS], x, y, size, size); ctx.globalAlpha = ga; }
    return;
  }
  if (d.hue) ctx.filter = `hue-rotate(${Math.round((G.rt * d.hue) % 360)}deg) saturate(1.3)`;   // 움짤 + 색 바뀜 (지금은 없음)
  if (sheet) { const [sx, sy, s] = animRect(a, enemyFrame(en), d.focusY); ctx.drawImage(sheet, sx, sy, s, s, x, y, size, size); }
  else ctx.drawImage(en.img, x, y, size, size);
  if (d.hue) ctx.filter = 'none';
}
// 움짤·사진 한 장면을 사각형에 꽉 차게 (편집점 화면)
function drawClip(clip, x, y, w, h, t) {
  if (clip.anim) {
    const a = clip.anim, im = IMG[a.sheet]; if (!im) return;
    const k = Math.floor(t * a.fps) % a.n, sx0 = (k % a.cols) * a.fw, sy0 = Math.floor(k / a.cols) * a.fh;
    const s = Math.max(w / a.fw, h / a.fh), cw = w / s, ch = h / s;
    ctx.drawImage(im, sx0 + (a.fw - cw) / 2, sy0 + (a.fh - ch) / 2, cw, ch, x, y, w, h);
  } else {
    const im = IMG[clip.img]; if (!im) return;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); drawCover(im, x, y, w, h); ctx.restore();
  }
}

/* ---------- 게임 속 커서 ---------- */
// rawMouse: 진짜 마우스 위치 / mouse: 게임 속 커서 (좌우 반전 · 바람 · 덜컹 · 흡입이 적용됨. 판정은 전부 mouse로)
const rawMouse = { x: 0, y: 0 };
const CUR = { mirror: 0, ox: 0, oy: 0, vx: 0, vy: 0, lx: 0, ly: 0 };
function applyCursor() {
  const x = CUR.mirror > 0 ? W - rawMouse.x : rawMouse.x;
  mouse.x = clamp(x + CUR.ox, 0, W); mouse.y = clamp(rawMouse.y + CUR.oy, 0, H);
}
function pushCursor(dx, dy) { CUR.ox += dx; CUR.oy += dy; applyCursor(); }
function resetCursor() { CUR.mirror = 0; CUR.ox = 0; CUR.oy = 0; applyCursor(); CUR.lx = mouse.x; CUR.ly = mouse.y; CUR.vx = CUR.vy = 0; }
function setMirror(sec) {
  const was = CUR.mirror > 0;
  CUR.mirror = sec; applyCursor(); CUR.lx = mouse.x; CUR.ly = mouse.y;
  if (!was) {
    texts.push({ str: '좌우 반전!!', x: W / 2, y: H * 0.3, vx: 0, vy: -30, size: 90, life: 0, max: 1.1, rot: rand(-0.08, 0.08), c1: '#ffffff', c2: '#b45cff' });
    SFX.glitch();
  }
}
function updateCursor(dt, rdt) {
  if (CUR.mirror > 0) {
    CUR.mirror -= dt;
    if (CUR.mirror <= 0) {
      CUR.mirror = 0; applyCursor(); CUR.lx = mouse.x; CUR.ly = mouse.y;
      texts.push({ str: '반전 풀림', x: W / 2, y: H * 0.3, vx: 0, vy: -40, size: 50, life: 0, max: 0.8, rot: 0, c1: '#ffffff', c2: '#9aa0b5' });
    }
  }
  const k = Math.exp(-dt * 2.5);   // 밀린 커서는 천천히 제자리로
  CUR.ox *= k; CUR.oy *= k;
  applyCursor();
  // 커서 속도 (비트세이버 베기 방향 판정)
  if (rdt > 0) { CUR.vx = lerp(CUR.vx, (mouse.x - CUR.lx) / rdt, 0.6); CUR.vy = lerp(CUR.vy, (mouse.y - CUR.ly) / rdt, 0.6); }
  CUR.lx = mouse.x; CUR.ly = mouse.y;
}

// 막을 수 없는 피해 (양심에 찔림, 거울 반사 등)
function selfHit(dmg, msg) {
  if (G.state !== 'fight') return;
  P.hp = Math.max(G.tut ? 1 : 0, P.hp - dmg); G.taken += dmg;
  G.hurtT = Math.max(G.hurtT, 0.6); addShake(0.2); P.vflinch += 300; G.combo = 0;
  SFX.hurt();
  texts.push({ str: `${msg} -${fmt(dmg)}`, x: W / 2, y: H * 0.62, vx: 0, vy: -150, size: 44, life: 0, max: 0.9, rot: rand(-0.06, 0.06), c1: '#ffd0d0', c2: '#ff2a3d' });
  if (P.hp <= 0) playerDown();
}
// 적에게 바로 피해 (큐브 베기, 편집점 찾기 등). 방어구 → 체력, 2페이즈 · 처치까지 처리
function dealEnemy(en, dmg, x, y) {
  if (!en || en.state !== 'fight') return;
  en.hp = Math.max(0, en.hp - armorHit(en, dmg)); G.dealt += dmg; en.idleT = 0;
  en.flash = 0.7; en.shakeT = 0.12; en.shakeA = 9; en.vsq += 1.5;
  texts.push({ str: fmt(dmg), x: x ?? enemyX(en) + rand(-60, 60), y: (y ?? EY) - 20, vx: rand(-100, 100), vy: rand(-480, -360), grav: 1200, size: 46, life: 0, max: 0.75, rot: 0, c1: '#ffffff', c2: '#ffd0d0' });
  if (en.hp <= 0) defeat(en);
  else if (en.def.phase2 && en.hp <= en.def.hp * en.def.phase2.at) enterPhase2(en);
}
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
// 적 이미지 안의 비율 영역 [x0, y0, x1, y1] 안에 있는지
function inBox(en, box, x, y) {
  const x0 = enemyX(en) - E / 2, y0 = EY - E / 2;
  return x >= x0 + box[0] * E && x <= x0 + box[2] * E && y >= y0 + box[1] * E && y <= y0 + box[3] * E;
}

/* ---------- 디스코드 알림 (#gifs 채널에 짤이 올라옴) ---------- */
function discordPost(en) {
  if (!chapter().discord || !en.def.post) return;
  G.dm = { post: en.def.post, img: en.img, t: 0 };
  SFX.ping();
}
function drawDiscord() {
  const m = G.dm; if (!m || G.state === 'menu') return;
  const w = Math.min(390, W - 40), h = 66, x = 20, y = 150;
  const a = m.t < 0.25 ? easeOutCubic(m.t / 0.25) : m.t > 3.6 ? Math.max(0, 1 - (m.t - 3.6) / 0.4) : 1;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(lerp(-w - 40, 0, a), 0);
  ctx.fillStyle = 'rgba(43,45,49,0.96)'; rr(ctx, x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = '#5865f2'; ctx.fillRect(x, y + 10, 4, h - 20);
  ctx.save(); ctx.beginPath(); ctx.arc(x + 36, y + h / 2, 22, 0, TAU); ctx.clip(); ctx.drawImage(m.img, x + 14, y + h / 2 - 22, 44, 44); ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = 'bold 15px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#f0b232'; ctx.fillText('지우현', x + 68, y + 11);
  const nw = ctx.measureText('지우현').width;
  ctx.font = '12px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#949ba4'; ctx.fillText('#gifs · 방금', x + 76 + nw, y + 13);
  ctx.font = '14px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#dbdee1';
  const post = m.post.length > 28 ? m.post.slice(0, 27) + '…' : m.post;
  ctx.fillText('📎 ' + post, x + 68, y + 37, w - 82);
  ctx.restore();
}

/* ---------- 적 행동 (def.ai) ----------
   attack(en): 쿨타임이 다 찼을 때 (없으면 원래 공격) / update(en, dt): 매 프레임
   onImpact(en, x, y): 주먹이 닿은 곳을 직접 처리 (true면 처리 끝) / onHit(en, x, y): 맞기 직전 (true면 피해 무효)
   drawLocal(en, size): 적 그림 위에 (적 좌표계) / drawTop(en): 화면 위에
   공격하는 동안은 en.busy = true (쿨타임이 안 참)                                                    */
const AI = {};

// 턱주가리: 입을 쩍 벌렸다가(빨개짐) 콱! 그 순간 커서가 얼굴 위에 있으면 물림
AI.chomp = {
  attack(en) {
    en.busy = true; en.chomp = { t: 0, tele: en.def.chomp.tele, hit: false };
    SFX.warn();
    texts.push({ str: '아~~', x: enemyX(en), y: EY - E * 0.42, vx: 0, vy: -40, size: 60, life: 0, max: 0.8, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#ff6b6b' });
  },
  update(en, dt) {
    const c = en.chomp; if (!c) return;
    c.t += dt;
    if (c.t < c.tele) en.sq = -0.14 * easeOutCubic(c.t / c.tele);   // 턱이 쭉 내려감 (세로로 늘어남)
    else if (!c.hit) {
      c.hit = true; en.vsq += 8; addShake(0.25);
      if (inEnemy(mouse.x, mouse.y, en)) {
        texts.push({ str: '콱!!', x: mouse.x, y: mouse.y - 60, vx: 0, vy: -60, size: 80, life: 0, max: 0.7, rot: rand(-0.2, 0.2), c1: '#ffffff', c2: '#ff2a3d' });
        hurtPlayer(en.def.chomp.dmg);
      } else {
        SFX.chomp();
        texts.push({ str: '헛물!', x: enemyX(en), y: EY + E * 0.2, vx: 0, vy: -60, size: 54, life: 0, max: 0.7, rot: 0, c1: '#ffffff', c2: '#9aa0b5' });
      }
    }
    if (c.t >= c.tele + 0.35) { en.chomp = null; en.busy = false; }
  },
  drawLocal(en, size) {
    const c = en.chomp; if (!c || c.hit) return;
    const q = c.t / c.tele, hs = size / 2;
    ctx.fillStyle = `rgba(255,20,40,${0.12 + 0.38 * q + 0.08 * Math.sin(G.rt * 30)})`;
    ctx.fillRect(-hs, -hs, size, size);
  },
  drawTop(en) {
    const c = en.chomp; if (!c || c.hit) return;
    outlinedText('커서 치워!', enemyX(en), EY + E * 0.05, 66 * (1 + 0.06 * Math.sin(G.rt * 20)), 'center', 'middle', '#ffffff', '#ff2a3d');
  },
};

// 흔들흔들: 멀리 있는 우현만 맞음 (hitbox). 선풍기 바람이 커서를 밀고, 선풍기를 때리면 강풍
function gustStart(en, dir, speed, dur, msg) {
  en.gust = { t: 0, dir, speed, dur };
  SFX.whoosh(); SFX.wind();
  texts.push({ str: msg || (dir > 0 ? '선풍기 바람 →' : '← 선풍기 바람'), x: W / 2, y: H * 0.22, vx: 0, vy: -20, size: 46, life: 0, max: 0.9, rot: 0, c1: '#ffffff', c2: '#7ad7ff' });
}
AI.fan = {
  update(en, dt) {
    en.gustCd = (en.gustCd ?? 2.5) - dt;
    if (en.gustCd <= 0 && !en.gust) gustStart(en, pick([-1, 1]), 420, 1.2);
    const g = en.gust; if (!g) return;
    g.t += dt;
    const k = Math.sin(Math.PI * clamp(g.t / g.dur, 0, 1));
    pushCursor(g.dir * g.speed * 1.6 * k * dt, 0);
    if (Math.random() < 0.7) addPart({ t: 'spark', x: g.dir > 0 ? rand(-50, W * 0.3) : rand(W * 0.7, W + 50), y: rand(0, H), vx: g.dir * rand(1600, 2400), vy: rand(-60, 60), life: 0, max: rand(0.25, 0.45), w: 2, color: '220,240,255' });
    if (g.t >= g.dur) { en.gust = null; en.gustCd = rand(2.4, 3.4); }
  },
  onImpact(en, x, y) {
    if (inEnemy(x, y, en)) return false;   // 우현을 맞힘 → 보통 처리
    if (inBox(en, en.def.fanBox, x, y)) {
      impactFx(x, y, false); SFX.block();
      gustStart(en, x < enemyX(en) ? 1 : -1, 900, 1.0, '선풍기를 때림! 강풍!!');
      en.gustCd = 3;
      return true;
    }
    if (Math.abs(x - enemyX(en)) <= E / 2 && Math.abs(y - EY) <= E / 2) {
      whiff(x, y);
      texts.push({ str: '너무 멀다', x, y: y - 40, vx: 0, vy: -60, size: 36, life: 0, max: 0.6, rot: 0, c1: '#ffffff', c2: '#9aa0b5' });
      return true;
    }
    return false;
  },
};

// 데칼코마니: 진짜 + 거울(반짝이는 쪽) 두 장. 거울을 때리면 반사 피해. 진짜를 몇 번 맞으면 섞임
const MIRROR_SWAP = 0.4;
function mirrorCopies(en) {
  if (en.realSide == null) en.realSide = pick([-1, 1]);
  const s =en.swapT > 0 ? 1 - en.swapT / MIRROR_SWAP : 1, from = en.prevSide ?? en.realSide ?? 1, to = en.realSide ?? 1;
  const side = s < 0.5 ? lerp(from, 0, s * 2) : lerp(0, to, (s - 0.5) * 2), x = side * E * 0.27, size = E * 0.54;
  return [{ x, size, flip: false, fake: false }, { x: -x, size, flip: true, fake: true }];
}
function mirrorCopyAt(en, x, y) {
  for (const c of mirrorCopies(en)) if (Math.abs(x - (enemyX(en) + c.x)) <= c.size / 2 && Math.abs(y - EY) <= c.size / 2) return c;
  return null;
}
AI.mirror = {
  update(en, dt) {
    if (en.swapT > 0) en.swapT = Math.max(0, en.swapT - dt);
  },
  onImpact(en, x, y) {
    const c = mirrorCopyAt(en, x, y);
    if (!c || en.swapT > 0) { whiff(x, y); return true; }

// 거울 쪽: 푸르스름 + 반짝이는 줄이 지나감

// 죄송합니다: 꾸벅(박치기) → 숙인 채로 "죄송합니다…" → 일어남. 숙인 동안 때리면 양심에 찔림
const BOW = { down: 0.5, strike: 0.32, hold: 1.4, up: 0.5 };
AI.bow = {
  attack(en) { en.busy = true; en.bowT = 0; en.bowHit = false; SFX.warn(); },

    if (en.bowT == null) { en.frame = null; return; }

    en.lunge = t < B.strike ? Math.pow(t / B.strike, 2) * 1.6 : Math.max(0, 1.6 * (1 - (t - B.strike) / 0.25));
    if (!en.bowHit && t >= B.strike) {
      en.bowHit = true; SFX.heavy();
      texts.push({ str: '꾸벅!!', x: enemyX(en), y: EY - E * 0.3, vx: 0, vy: -50, size: 80, life: 0, max: 0.7, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#ff7a1a' });
      hurtPlayer(en.def.damage);
    }

// "네" 우현: 질문 + 떠다니는 대답들. "네"를 때리면 기분 좋아져서 기절, 틀리거나 시간 초과면 피해

  },
};
function quizAnswer(b) {

// 비트세이버: 박자에 맞춰 큐브가 날아옴 → 화살표 방향으로 커서를 그어서 벰 (주먹은 안 닿음)
const BEAT = 60 / 128, CUBE = 110, DIRV = [[0, -1], [0, 1], [-1, 0], [1, 0]];
const cubeGap = () => Math.min(170, W * 0.12);
AI.beat = {
  update(en, dt) { en.beatPulse = Math.max(0, (en.beatPulse || 0) - dt * 4); },
  drawTop(en) {   // 큐브가 도착하는 자리 (박자에 맞춰 번쩍)
    if (!en.pat || en.pat.name !== 'beat') return;
    const gap = cubeGap(), pulse = en.beatPulse || 0;
    ctx.save();
    for (let lane = 0; lane < 4; lane++) for (let row = 0; row < 2; row++) {
      const x = W / 2 + (lane - 1.5) * gap, y = H * 0.58 + (row - 0.5) * gap;
      ctx.strokeStyle = `rgba(255,255,255,${0.25 + pulse * 0.35})`; ctx.lineWidth = 3;
      ctx.strokeRect(x - CUBE / 2, y - CUBE / 2, CUBE, CUBE);
    }
    ctx.restore();
  },
};
function spawnCube(en, lane, row, dir, bomb) {
  const gap = cubeGap(), sx = enemyX(en), sy = EY - E * 0.05;
  bullets.push({ k: 'cube', sx, sy, x: sx, y: sy, s: 0.15, tx: W / 2 + (lane - 1.5) * gap, ty: H * 0.58 + (row - 0.5) * gap, t: 0, travel: BEAT * 2, dir, bomb, red: lane < 2, upd: updCube, draw: drawCube });
}
function updCube(b, dt, mx, my, live) {
  if (b.dead) { b.dt += dt; return b.dt < 0.45; }
  const p = b.t / b.travel, e = Math.min(1, Math.pow(p, 1.4));
  b.x = lerp(b.sx, b.tx, e); b.y = lerp(b.sy, b.ty, e);
  b.s = p < 1 ? lerp(0.15, 1, p * p) : 1 + (p - 1) * 2.5;
  b.win = p >= 0.8 && p <= 1.16;   // 벨 수 있는 구간
  if (live && b.win) {
    const half = CUBE * b.s / 2 + 14;
    if (Math.abs(mx - b.x) < half && Math.abs(my - b.y) < half) {
      if (b.bomb) { bombHit(b); return; }
      const sp = Math.hypot(CUR.vx, CUR.vy);
      if (sp > 520) {   // 화살표 방향으로 그어야 베임. 다른 방향으로 지나가면 안 베이고 표시만
        if (b.dir < 0 || (CUR.vx * DIRV[b.dir][0] + CUR.vy * DIRV[b.dir][1]) / sp > 0.5) { cubeCut(b, Math.abs(p - 1) < 0.09); return; }
        if (!b.warned) { b.warned = true; texts.push({ str: '방향!', x: b.x, y: b.y - 60, vx: 0, vy: -60, size: 36, life: 0, max: 0.5, rot: 0, c1: '#ffffff', c2: '#9aa0b5' }); }
      }
    }
  }
  if (p > 1.16) {
    if (!b.bomb && live) {
      texts.push({ str: 'MISS', x: b.x, y: b.y - 60, vx: 0, vy: -60, size: 44, life: 0, max: 0.6, rot: 0, c1: '#ffffff', c2: '#9aa0b5' });
      hurtPlayer(10);
    }
    return false;
  }
}
function cubeCut(b, perfect) {
  b.dead = true; b.dt = 0; b.cutA = Math.atan2(CUR.vy, CUR.vx);
  SFX.slash();
  const col = b.red ? '255,60,90' : '60,140,255';
  for (let i = 0; i < 14; i++) { const a = rand(0, TAU), sp = rand(300, 1000); addPart({ t: 'spark', x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rand(0.15, 0.3), w: 3, color: col, g: 900 }); }
  G.combo++; G.comboT = 1.6; G.comboPop = 1; G.maxCombo = Math.max(G.maxCombo, G.combo);
  texts.push({ str: perfect ? 'PERFECT' : 'GOOD', x: b.x, y: b.y - 70, vx: 0, vy: -80, size: perfect ? 50 : 40, life: 0, max: 0.6, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: perfect ? '#ffd23a' : '#7ad7ff' });
  dealEnemy(curEnemy(), perfect ? 36 : 26);
}
function bombHit(b) {
  b.dead = true; b.dt = 0; b.cutA = 0;
  impactFx(b.x, b.y, true); SFX.boom(); addShake(0.5);
  texts.push({ str: 'BOMB!', x: b.x, y: b.y - 70, vx: 0, vy: -60, size: 60, life: 0, max: 0.7, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#ff2a3d' });
  hurtPlayer(15);
}
function drawCube(b) {
  const sz = CUBE * b.s;
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.dead) {   // 반으로 갈라져 날아감
    if (b.bomb) { ctx.restore(); return; }
    const k = b.dt / 0.45, nx = -Math.sin(b.cutA), ny = Math.cos(b.cutA), d = b.dt * 420;
    ctx.globalAlpha = 1 - k;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(nx * d * side, ny * d * side); ctx.rotate(b.cutA + side * k * 1.2);
      ctx.fillStyle = b.red ? '#ff2d55' : '#2d7bff'; ctx.fillRect(-sz / 2, side < 0 ? -sz / 2 : 0, sz, sz / 2);
      ctx.restore();
    }
    ctx.restore(); return;
  }
  if (b.bomb) {
    ctx.fillStyle = '#1a1a1f'; ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU, r = sz * (i % 2 ? 0.32 : 0.48); i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    const col = b.red ? '#ff2d55' : '#2d7bff';
    ctx.shadowColor = col; ctx.shadowBlur = b.win ? 34 : 14;
    ctx.fillStyle = '#16141c'; rr(ctx, -sz / 2, -sz / 2, sz, sz, sz * 0.12); ctx.fill();
    ctx.lineWidth = Math.max(2, sz * 0.07); ctx.strokeStyle = b.win ? '#ffffff' : col; ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff';
    if (b.dir < 0) { ctx.beginPath(); ctx.arc(0, 0, sz * 0.14, 0, TAU); ctx.fill(); }
    else {
      ctx.rotate([0, Math.PI, -Math.PI / 2, Math.PI / 2][b.dir]);
      ctx.beginPath(); ctx.moveTo(-sz * 0.32, -sz * 0.02); ctx.lineTo(sz * 0.32, -sz * 0.02); ctx.lineTo(0, -sz * 0.34); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}
function beatSpawn(en, p) {
  if (p.dense && p.k % 2 === 0) {   // 2개 동시: 옆 칸 두 개 → 한 번에 가로로 그으면 됨
    const lane = pick([0, 1, 2]), row = randInt(0, 1), dir = pick([2, 3]);
    spawnCube(en, lane, row, dir, false); spawnCube(en, lane + 1, row, dir, false);

/* ---------- 매드무비 우현 (보스) ---------- */
// 편집점: 화면이 4칸으로 나뉘고 장면이 계속 바뀜 → 글리치 걸린 칸(진짜 매드무비 우현)을 때리면 큰 피해 + 기절
const CLIPS = [
  { anim: ANIM.shake }, { anim: ANIM.bump }, { anim: ANIM.sorry }, { anim: ANIM.beat },
  { img: S3 + 'hoit.jpg' }, { img: S3 + 'chin.jpg' }, { img: S3 + 'rush.jpg' }, { img: S3 + 'rainbow.jpg' },
  { img: S3 + 'decal.gif' }, { img: S3 + 'pepper_spin.jpg' },
];
function clearKind(k) { for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].k === k) bullets.splice(i, 1); }
function jumpCut(en, p) {
  clearKind('panel');
  const m = 24, gap = 12, pw = (W - m * 2 - gap) / 2, ph = (H - m * 2 - gap) / 2, real = randInt(0, 3), clips = shuffle(CLIPS.slice());
  for (let k = 0; k < 4; k++) {
    bullets.push({
      k: 'panel', under: true, x: m + (k % 2) * (pw + gap), y: m + Math.floor(k / 2) * (ph + gap), w: pw, h: ph, real: k === real,
      clip: k === real ? { anim: en.def.anim } : clips[k], p, en, t: 0, bad: 0, ofs: rand(0, 10),
      contains(px, py) { return px >= this.x && px <= this.x + this.w && py >= this.y && py <= this.y + this.h; },
      onHit(px, py) { panelHit(this, px, py); }, upd: b => { b.bad = Math.max(0, b.bad - 0.05); }, draw: drawPanel,
    });
  }
  G.cutFlash = 1; SFX.cut();
}
function panelHit(b, x, y) {
  if (!b.real) {
    b.bad = 1; SFX.buzz();
    texts.push({ str: 'NG!', x, y: y - 40, vx: 0, vy: -60, size: 70, life: 0, max: 0.6, rot: rand(-0.2, 0.2), c1: '#ffffff', c2: '#ff2a3d' });
    hurtPlayer(15);
    return;
  }
  b.p.over = true; clearKind('panel');
  impactFx(x, y, true); SFX.heavy(); G.cutFlash = 1; G.hitStop = Math.max(G.hitStop, 0.15); addShake(0.6);
  texts.push({ str: '찾았다!!', x: W / 2, y: H * 0.3, vx: 0, vy: -30, size: 100, life: 0, max: 1.0, rot: rand(-0.08, 0.08), c1: '#ffffff', c2: '#ffd23a' });
  const en = b.en, def = en.def;
  dealEnemy(en, 150, EX, EY);
  if (en.state === 'fight' && en.def === def && G.state === 'fight') stunBoss(en, 2);   // 2페이즈로 넘어갔으면 기절 없음
}
function drawPanel(b) {
  ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(b.x, b.y, b.w, b.h);
  drawClip(b.clip, b.x + (b.real ? rand(-6, 6) : 0), b.y, b.w, b.h, G.time + b.ofs);
  if (b.real) {   // 진짜 우현(매드무비) 칸: 색 띠가 번쩍이는 글리치 + 스캔라인
    ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
    ctx.globalCompositeOperation = 'screen';
    for (let k = 0; k < 4; k++) {
      const yy = b.y + (Math.sin(G.rt * (7 + k * 3) + k * 2.1) * 0.5 + 0.5) * b.h;
      ctx.fillStyle = k % 2 ? 'rgba(255,0,200,0.45)' : 'rgba(0,255,255,0.45)';
      ctx.fillRect(b.x, yy, b.w, 6 + (k * 7) % 18);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    for (let yy = b.y; yy < b.y + b.h; yy += 4) ctx.fillRect(b.x, yy, b.w, 1);
    ctx.restore();
  }
  ctx.lineWidth = 4; ctx.strokeStyle = b.bad > 0 ? `rgba(255,40,60,${0.5 + b.bad * 0.5})` : 'rgba(255,255,255,0.9)';
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = Math.floor(G.rt * 2) % 2 ? '#ff2a3d' : 'rgba(255,42,61,0.35)';
  ctx.beginPath(); ctx.arc(b.x + 24, b.y + 24, 7, 0, TAU); ctx.fill();
  ctx.font = fontStr(16); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('REC', b.x + 36, b.y + 25);
  ctx.restore();
}

// 자막 폭격: 큰 자막이 가로로 휙 지나감 (지나갈 줄이 먼저 빨갛게 표시)
const SUBS = ['레전드 ㄷㄷ', '??? : 호잇', '킹받네', '실화냐', 'ㅋㅋㅋㅋㅋㅋㅋ', '이게 되네', '(대충 웃긴 자막)', '편집자 퇴사함', '응 아니야', '갑분싸', '여기서 반전'];
function spawnSub(speed) {
  const dir = pick([-1, 1]), text = pick(SUBS), size = 50;
  ctx.font = fontStr(size);
  const w = ctx.measureText(text).width + 56, h = size + 28, y = rand(H * 0.2, H * 0.86);
  bullets.push({ k: 'sub', text, size, w, h, y, dir, x: dir > 0 ? -w / 2 - 10 : W + w / 2 + 10, speed, warn: 0.55, t: 0, dmg: 13, upd: updSub, draw: drawSub });
}
function updSub(b, dt, mx, my, live) {
  if (b.t < b.warn) return;
