// 광고: 영숙이 아들급 광고 창이 뜸. 떠 있는 동안 보스가 회복(광고 수익). 진짜 X(제목줄 오른쪽 끝)로만 닫힘
// 광고를 잘못 누르면 광고가 하나 더 뜸. 2페이즈 광고에는 가짜 X가 있음
const ADS = [S3 + 'ad_1.jpg', S3 + 'ad_2.jpg'];
const AD_BAR = 34;
const adX = b => ({ x: b.x + b.s / 2 - 20, y: b.y - b.s / 2 - AD_BAR / 2 });
function spawnAd(en, lvl) {
  if (bullets.filter(b => b.k === 'ad').length >= 2) return false;
  const s = Math.min(W * 0.46, H * 0.58);
  const x = clamp(W / 2 + rand(-0.25, 0.25) * W, s / 2 + 12, W - s / 2 - 12), y = clamp(H / 2 + rand(-0.08, 0.12) * H, s / 2 + AD_BAR + 12, H - s / 2 - 12);
  const fakes = lvl ? [[rand(-0.3, 0.3), rand(-0.3, 0.1)], [rand(-0.3, 0.3), rand(0.15, 0.4)]] : [];
  bullets.push({
    k: 'ad', under: true, img: ADS[lvl], lvl, x, y, s, t: 0, heal: lvl ? 55 : 35, fakes, tick: 0,
    contains(px, py) { return Math.abs(px - this.x) < this.s / 2 && py > this.y - this.s / 2 - AD_BAR && py < this.y + this.s / 2; },
    onHit(px, py) { adClick(this, px, py); }, upd: updAd, draw: drawAd,
  });
  SFX.ping();
  texts.push({ str: '광고!', x, y: y - s / 2 - 60, vx: 0, vy: -40, size: 54, life: 0, max: 0.8, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#ffb03c' });
  return true;
}
function adClick(b, px, py) {
  const X = adX(b);
  if (Math.hypot(px - X.x, py - X.y) < 24) {
    bullets.splice(bullets.indexOf(b), 1);
    SFX.ready(); impactFx(X.x, X.y, false);
    for (let i = 0; i < 16; i++) addPart({ t: 'chip', x: b.x + rand(-b.s / 2, b.s / 2), y: b.y + rand(-b.s / 2, b.s / 2), vx: rand(-500, 500), vy: rand(-700, -100), rot: rand(0, TAU), vr: rand(-20, 20), size: rand(8, 16), color: pick(['#f2f3f5', '#ff6bd6', '#ffd23a']), life: 0, max: rand(0.4, 0.8) });
    texts.push({ str: '광고 닫음', x: X.x, y: X.y - 30, vx: 0, vy: -60, size: 40, life: 0, max: 0.7, rot: 0, c1: '#ffffff', c2: '#5be07a' });
    return;
  }
  SFX.buzz();
  texts.push({ str: '광고를 눌러버림…', x: px, y: py - 40, vx: 0, vy: -60, size: 40, life: 0, max: 0.8, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#ffb03c' });
  const en = curEnemy();
  if (!spawnAd(en, b.lvl) && en && en.state === 'fight') { en.hp = Math.min(en.def.hp, en.hp + 80); en.hpChip = Math.max(en.hpChip, en.hp); }
}
function updAd(b, dt) {
  const en = curEnemy(); if (!en || en.state !== 'fight' || G.state !== 'fight') return;
  en.hp = Math.min(en.def.hp, en.hp + b.heal * dt); en.hpChip = Math.max(en.hpChip, en.hp);
  b.tick -= dt;
  if (b.tick <= 0) { b.tick = 0.7; texts.push({ str: `+${fmt(b.heal * 0.7)} 광고 수익`, x: enemyX(en) + rand(-E * 0.3, E * 0.3), y: EY - E * 0.3, vx: 0, vy: -60, size: 28, life: 0, max: 0.7, rot: 0, c1: '#eaffea', c2: '#3ddc84' }); }
}
function drawAd(b) {
  const x0 = b.x - b.s / 2, y0 = b.y - b.s / 2, pop = easeOutBack(clamp(b.t / 0.25, 0, 1));
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(pop, pop); ctx.translate(-b.x, -b.y);
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#f2f3f5'; rr(ctx, x0 - 4, y0 - AD_BAR, b.s + 8, b.s + AD_BAR + 4, 8); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = 'bold 14px "Malgun Gothic", sans-serif'; ctx.fillStyle = '#313338'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(b.lvl ? '광고 · 영숙이 아들급 (풀옵션)' : '광고 · 영숙이 아들급', x0 + 8, y0 - AD_BAR / 2, b.s - 60);
  const im = IMG[b.img];
  if (im) { ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, b.s, b.s); ctx.clip(); drawCover(im, x0, y0, b.s, b.s); ctx.restore(); }
  const X = adX(b);   // 진짜 X: 작고 회색
  ctx.fillStyle = '#c4c9d0'; ctx.beginPath(); ctx.arc(X.x, X.y, 12, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#313338'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(X.x - 5, X.y - 5); ctx.lineTo(X.x + 5, X.y + 5); ctx.moveTo(X.x + 5, X.y - 5); ctx.lineTo(X.x - 5, X.y + 5); ctx.stroke();
  for (const [fx, fy] of b.fakes) {   // 가짜 X: 크고 눈에 띄게
    const cx = b.x + fx * b.s, cy = b.y + fy * b.s;
    ctx.fillStyle = 'rgba(30,30,30,0.85)'; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - 9, cy - 9); ctx.lineTo(cx + 9, cy + 9); ctx.moveTo(cx + 9, cy - 9); ctx.lineTo(cx - 9, cy + 9); ctx.stroke();
  }
  ctx.restore();
}

// 콧구멍 (2페이즈)
function nosePoint(en) { const [fx, fy] = en.def.nose || [0.5, 0.5]; return { x: enemyX(en) - E / 2 + fx * E, y: EY - E / 2 + fy * E }; }
function blowRing(en, i) {

  for (let k = 0; k < cnt; k++) { const a = off + (k / cnt) * TAU; bullets.push({ k: 'drop', x: n.x, y: n.y, vx: Math.cos(a) * 400, vy: Math.sin(a) * 400, r: 15, dmg: 9, t: 0, col: 'snot' }); }

// 무지개 파동: 무지개 고리가 퍼져 나감. 빈틈(각도)에 커서를 두면 안 맞음
function spawnRing(en, speed, gapW) {
  bullets.push({ k: 'rring', x: enemyX(en), y: EY, r: 30, speed, w: 34, gapA: rand(0, TAU), gapW, hue: rand(0, 360), dmg: 12, t: 0, upd: updRing, draw: drawRing });
  SFX.wave();
}
function updRing(b, dt, mx, my, live) {
  b.r += b.speed * dt; b.hue += 160 * dt;
  if (b.r > Math.hypot(Math.max(b.x, W - b.x), Math.max(b.y, H - b.y)) + b.w) return false;
  const d = Math.hypot(mx - b.x, my - b.y);
  if (live && Math.abs(d - b.r) < b.w / 2 && Math.abs(angDiff(Math.atan2(my - b.y, mx - b.x), b.gapA)) > b.gapW / 2) soulHit(b.dmg);
}
function drawRing(b) {
  const a0 = b.gapA + b.gapW / 2, a1 = b.gapA - b.gapW / 2 + TAU;
  ctx.save(); ctx.lineCap = 'butt';
  ctx.shadowColor = `hsl(${b.hue % 360},100%,60%)`; ctx.shadowBlur = 20;
  for (let j = 0; j < 6; j++) {   // 고리 하나 = 여섯 색 띠
    ctx.strokeStyle = `hsl(${(b.hue + j * 50) % 360},100%,60%)`; ctx.lineWidth = b.w / 6 + 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(1, b.r - b.w / 2 + (j + 0.5) * b.w / 6), a0, a1); ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;   // 빈틈 양쪽 끝 표시
  for (const a of [a0, a1]) { ctx.beginPath(); ctx.moveTo(b.x + Math.cos(a) * (b.r - b.w), b.y + Math.sin(a) * (b.r - b.w)); ctx.lineTo(b.x + Math.cos(a) * (b.r + b.w), b.y + Math.sin(a) * (b.r + b.w)); ctx.stroke(); }
  ctx.restore();
}
// 거울 조각 (좌우 반전 패턴에서 날아오는 탄)
function drawShard(b) {
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  const g = ctx.createLinearGradient(-30, -30, 30, 30);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#9fe3ff'); g.addColorStop(1, '#5aa8ff');
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(160,230,255,0.9)'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(20, 12); ctx.lineTo(-6, 28); ctx.lineTo(-22, -4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 그리기: 손보다 아래(편집점·광고) / 화면 위(적 행동 표시) ---------- */
function drawOverlays() {

function drawEnemyTop() {

    outlinedText('= 멈추기', W / 2 + 175, H - 40, 26, 'center', 'middle', '#ffffff', '#cccccc');
  }
  const ai = en.def.ai && AI[en.def.ai];

  const p = en.pat;
  if (p && p.name === 'inhale' && !p.done && p.t < 3.4) {   // 흡입: 콧구멍 위험 구역
    const n = nosePoint(en);

    ctx.restore();

}

function playerDown() {

/* =====================================================================
   타격 (타격감의 핵심)
   ===================================================================== */
const JAB_WORDS = ['퍽!', '팍!', '빡!', '퍽!!', '탁!'];

function onImpact(x, y) {
  const wp = wpAt(x, y);
  if (wp) { hitWp(wp, x, y); return; }
  const en = curEnemy(), ai = en && en.state === 'fight' && en.def.ai && AI[en.def.ai];
  if (ai && ai.onImpact && ai.onImpact(en, x, y)) return;
  if (en && en.state === 'fight' && inEnemy(x, y)) hitEnemy(en, x, y);
  else whiff(x, y);
}

function whiff(x, y) {
  for (let i = 0; i < 5; i++)
    addPart({ t: 'dust', x, y, vx: rand(-140, 140), vy: rand(-140, 60), r: rand(8, 16), life: 0, max: rand(0.25, 0.4) });
  addPart({ t: 'ring', x, y, r0: 10, r1: 50, w: 3, life: 0, max: 0.18, color: '255,255,255', a: 0.35 });
}

// 보스 2페이즈: 체력이 일정 이하가 되면 다른 사진·이름·공격으로 바뀜 (최대 체력은 그대로)
function enterPhase2(en) {
  const p2 = en.def.phase2;
  en.def = { ...en.def, ...p2, hp: en.def.hp, phase2: null };
  if (p2.img && !p2.anim) en.def.anim = null;   // 움짤 → 사진으로 바뀜
  en.img = cropFor(en.def);
  en.frame = null; en.busy = false; en.chomp = en.bowT = en.bumpT = en.quiz = en.gust = null; en.spin = 0; en.swapT = 0;
  resetCursor();
  en.cd = 0; en.warned = false; en.lungeT = -1; en.lunge = 0; en.burstLeft = 0; en.shotsLeft = 0; en.fireT = 0; en.run = 0; en.pat = null; en.stunT = 0;
  notes.length = 0; clearBullets();
  en.flash = 1; en.shakeT = 0.4; en.shakeA = 22; en.vsc += 2; en.vsq += 4;
  G.hitStop = Math.max(G.hitStop, 0.35); G.blockT = 0;
  addShake(0.9); cam.vkz += 2.5;
  impactFx(enemyX(en), EY, true);
  const bt = p2.hint ? 2.4 : 1.8;
  setBanner('PHASE 2', en.def.name, '#ff3b3b', bt, p2.hint || ''); SFX.boss(); SFX.heavy();
  G.state = 'announce'; G.introT = bt; buffered = null;
}

function dodge(en, x, y) {
  en.vdx += (x < EX ? 1 : -1) * 1500;   // 주먹 반대쪽으로 쓱 피함
  SFX.whoosh(); SFX.deny();
  texts.push({ str: '회피!', x, y: y - 50, vx: 0, vy: -70, size: 54, life: 0, max: 0.6, rot: rand(-0.15, 0.15), c1: '#ffffff', c2: '#9aa0b5' });
  addPart({ t: 'ring', x, y, r0: 10, r1: 70, w: 3, life: 0, max: 0.2, color: '200,200,220', a: 0.6 });
}

// 방어구: 피해를 먼저 받아내고, 넘친 만큼만 체력으로. 다 깨지면 이펙트
function armorHit(en, dmg) {
  if (!(en.armor > 0)) return dmg;
  const a = Math.min(en.armor, dmg);
  en.armor -= a;
  if (en.armor <= 0) {
    en.armor = 0;
    SFX.counter(); addShake(0.5); cam.vkz += 1.2;
    impactFx(EX, EY - E * 0.1, true);
    addPart({ t: 'ring', x: EX, y: EY, r0: 40, r1: E * 0.7, w: 14, life: 0, max: 0.35, color: '160,200,255', a: 1 });
    texts.push({ str: '방어구 파괴!', x: EX, y: EY - E * 0.35, vx: 0, vy: -40, size: 70, life: 0, max: 1.1, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#6aa8ff' });
  }
  return dmg - a;
}
function hitEnemy(en, x, y) {
  // 회피: 공격 무효 (기절 중이거나 방어구가 남아 있으면 무조건 맞음)
  if (en.def.evade && !(en.stunT > 0) && !(en.armor > 0) && Math.random() < en.def.evade) { dodge(en, x, y); return; }
  const ai = en.def.ai && AI[en.def.ai];
  if (ai && ai.onHit && ai.onHit(en, x, y)) return;   // 맴맴(정면 아님) · 사과 중 등
  const w = weapon(), bonus = P.bonus, counter = bonus > 0;
  const beat = w.ability && w.ability.beat, ph = beat ? (G.rt % beat) / beat : 0.5;
  const onBeat = beat && (ph < w.ability.beatWin / beat || ph > 1 - w.ability.beatWin / beat);   // 박자 ± beatWin초
  const dmg = (w.damage + bonus) * (onBeat ? 2 : 1);
  P.bonus = 0;
  if (en.def.panic && bullets.some(b => b.k === 'wp')) {   // 피규어가 남아 있으면 때려도 회복됨
    en.hp = Math.min(en.def.hp, en.hp + dmg); en.hpChip = Math.max(en.hpChip, en.hp);
    en.flash = 0.5; en.shakeT = 0.1; en.shakeA = 5;
    texts.push({ str: `+${fmt(dmg)}`, x, y: y - 30, vx: 0, vy: -200, size: 46, life: 0, max: 0.7, rot: 0, c1: '#eaffea', c2: '#3ddc84' });
    texts.push({ str: '피규어부터 부숴!', x: EX, y: EY - E * 0.42, vx: 0, vy: -40, size: 40, life: 0, max: 0.8, rot: 0, c1: '#ffffff', c2: '#7ad7ff' });
    SFX.deny();
    return;
  }
  en.hp = Math.max(G.tut && G.tut.step < TUT_STEPS.length - 1 ? 1 : 0, en.hp - armorHit(en, dmg));   // 튜토리얼 마지막 단계 전엔 안 쓰러짐
  if (G.tut) { G.tut.hits++; if (counter) G.tut.counters++; }
  G.dealt += dmg;
  en.idleT = 0;
  const kill = en.hp <= 0;
  if (!kill && en.def.phase2 && en.hp <= en.def.hp * en.def.phase2.at) { enterPhase2(en); return; }
  G.combo++; G.comboT = 1.2; G.comboPop = 1; G.maxCombo = Math.max(G.maxCombo, G.combo);

  // 1) 히트스톱: 맞는 순간 화면을 잠깐 멈춤
  let hs = counter ? 0.11 : 0.055;
  if (kill) hs = en.def.boss ? 0.24 : 0.16;
  G.hitStop = Math.max(G.hitStop, hs);

  // 2) 카메라: 흔들림 + 순간 줌
  addShake(counter ? 0.45 : 0.18);
  cam.vkz += counter ? 1.6 : 0.6;
  cam.vkx += ((x - EX) / E) * (counter ? 140 : 60);
  cam.vky += counter ? 90 : 35;

  // 3) 적 반응: 하얗게 번쩍, 멈춘 동안 덜덜, 출렁, 살짝 밀려남
  en.flash = 1;
  en.shakeT = hs + 0.03; en.shakeA = counter ? 16 : 7;
  en.vsq += counter ? 3.5 : 1.6;
  en.vsc -= counter ? 1.4 : 0.6;
  en.vrot += ((x - EX) / (E / 2)) * (counter ? 1.4 : 0.6);

  // 4) 이펙트 / 사운드 / 글자
  impactFx(x, y, counter);
  if (counter) SFX.heavy(); else if (w.hitSound === 'whack') SFX.whack(); else if (w.hitSound === 'saber') { SFX.slash(); SFX.jab(G.combo); } else SFX.jab(G.combo);
  if (onBeat) { SFX.kick(); texts.push({ str: 'PERFECT ×2', x: x + rand(-20, 20), y: y - 120, vx: 0, vy: -60, size: 48, life: 0, max: 0.6, rot: rand(-0.1, 0.1), c1: '#ffffff', c2: '#ff2d55' }); }
  texts.push({
    str: fmt(dmg), x: x + rand(-30, 30), y: y - 20, vx: rand(-120, 120), vy: rand(-520, -380), grav: 1200,
    size: counter ? 64 : 40, life: 0, max: 0.75, rot: 0,
    c1: counter ? '#ffe14d' : '#ffffff', c2: counter ? '#ff3b1a' : '#ffd0d0',
  });
  if (counter) {
    texts.push({ str: '반격!!', x: x + rand(-30, 30), y: y - 110, vx: 0, vy: -40, size: 100, life: 0, max: 0.8, rot: rand(-0.2, 0.2), c1: '#fff27a', c2: '#ff7a1a' });
  } else if (Math.random() < 0.4) {
    texts.push({ str: pick(JAB_WORDS), x: x + rand(-40, 40), y: y - rand(60, 100), vx: 0, vy: -40, size: 58, life: 0, max: 0.5, rot: rand(-0.3, 0.3), c1: '#ffffff', c2: '#ffd23a' });
  }
  if (navigator.vibrate) navigator.vibrate(counter ? 35 : 12);
  if (kill) defeat(en);
}

/* =====================================================================
   파티클
   ===================================================================== */
function addPart(p) { if (parts.length < 800) parts.push(p); }
function burstPts(n) { const a = []; for (let i = 0; i < n * 2; i++) a.push(i % 2 ? rand(0.35, 0.5) : rand(0.8, 1.15)); return a; }

function impactFx(x, y, big) {
  addPart({ t: 'flash', x, y, r: big ? 240 : 130, life: 0, max: big ? 0.16 : 0.1 });
  addPart({ t: 'burst', x, y, r: big ? 140 : 75, life: 0, max: big ? 0.12 : 0.07, rot: rand(0, TAU), pts: burstPts(big ? 16 : 12), big });
  addPart({ t: 'ring', x, y, r0: 20, r1: big ? 280 : 130, w: big ? 14 : 7, life: 0, max: big ? 0.35 : 0.22, color: '255,255,255', a: 0.9 });
  const n = big ? 28 : 12;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(500, 1400) * (big ? 1.4 : 1);
    addPart({ t: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 150, life: 0, max: rand(0.12, 0.3), w: rand(2, 5) * (big ? 1.4 : 1), color: pick(['255,255,255', '255,240,150', '255,190,60']), g: 1400 });
  }
  for (let i = 0; i < (big ? 8 : 3); i++) {
    addPart({ t: 'chip', x, y, vx: rand(-500, 500), vy: rand(-700, -200), rot: rand(0, TAU), vr: rand(-20, 20), size: rand(5, 11), color: pick(['#ffffff', '#ffe9a8', '#dddddd']), life: 0, max: rand(0.5, 0.9) });
  }
  if (big) G.focus = { x, y, life: 0, max: 0.2 };
}

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.t === 'spark' || p.t === 'chip' || p.t === 'dust' || p.t === 'fire') {
      p.x += p.vx * dt; p.y += p.vy * dt;
      const dr = Math.exp(-dt * (p.t === 'dust' ? 6 : 3));
      p.vx *= dr; p.vy *= dr;
      if (p.g) p.vy += p.g * dt;
      if (p.t === 'chip') { p.vy += 1600 * dt; p.rot += p.vr * dt; }
    }
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life += dt;
    if (t.life >= t.max) { texts.splice(i, 1); continue; }
    t.x += t.vx * dt; t.y += t.vy * dt;
    if (t.grav) t.vy += t.grav * dt; else t.vy *= Math.exp(-dt * 3);
  }
}

/* =====================================================================
   메인 루프
   ===================================================================== */
function update(dt, rdt) {
  G.time += dt; G.rt += rdt;

  cam.trauma = Math.max(0, cam.trauma - rdt * 1.8);
  const sh = cam.trauma * cam.trauma;
  cam.sx = rand(-1, 1) * sh * 34; cam.sy = rand(-1, 1) * sh * 34; cam.rot = rand(-1, 1) * sh * 0.035;
  spring(cam, 'kx', 'vkx', 260, 16, rdt); spring(cam, 'ky', 'vky', 260, 16, rdt); spring(cam, 'kz', 'vkz', 300, 18, rdt);

  updateCursor(dt, rdt);
  if (G.dm) { G.dm.t += rdt; if (G.dm.t > 4) G.dm = null; }
  G.cutFlash = Math.max(0, (G.cutFlash || 0) - rdt * 5);

  // 공격
  P.atkT += dt;
  if (buffered) {
    buffered.t -= rdt;
    if (buffered.t <= 0 || P.guarding || !canAct()) buffered = null;
    else if (P.atkT >= weapon().attackInterval) { const b = buffered; buffered = null; doPunch(b.x, b.y); }
  }
  RHs.t += dt;
  if (RHs.state === 'punch') {
    const sw = swingOf();
    if (!RHs.hit && RHs.t >= sw.impact) { RHs.hit = true; onImpact(RHs.tx, RHs.ty); }
    if (RHs.t >= sw.impact + sw.hold) { RHs.state = 'recover'; RHs.t = 0; }
  } else if (RHs.state === 'recover' && RHs.t >= PUNCH_REC) RHs.state = 'idle';
  updateUlt(dt);

  // 카운터
  P.poseT = Math.max(0, P.poseT - dt);
  if (P.counterT > 0) {
    P.counterT -= dt;
    if (P.counterT <= 0) { P.counterT = 0; P.counterCd = weapon().counter ? weapon().counter.cooldown : 0; }   // 아무것도 안 막음 → 쿨타임
  } else if (P.counterCd > 0) {
    P.counterCd -= dt;
    if (P.counterCd <= 0) { P.counterCd = 0; SFX.ready(); }
  }

  // 가드
  const g = guardOf();
  if (P.guarding && g) {
    P.guardT += dt;
    if (P.guardT >= g.maxHold) { P.guardT = g.maxHold; endGuard(); }
  } else if (P.guardCd > 0) {
    P.guardCd -= dt;
    if (P.guardCd <= 0) { P.guardCd = 0; SFX.ready(); }
  }
  LHs.t += dt; LHs.shakeT = Math.max(0, LHs.shakeT - rdt);
  spring(LHs, 'push', 'vpush', 300, 16, dt);
  if (LHs.state === 'lower' && LHs.t >= 0.14) LHs.state = 'idle';
  spring(P, 'flinch', 'vflinch', 200, 14, dt);

  const en = curEnemy();
  if (en) updateEnemy(en, dt, rdt);
  updateNotes(dt);
  updateBullets(dt, rdt);
  updateParts(dt);

  if (G.focus) { G.focus.life += dt; if (G.focus.life >= G.focus.max) G.focus = null; }
  G.hurtT = Math.max(0, G.hurtT - rdt * 1.8);
  G.blockT = Math.max(0, G.blockT - rdt * 3);
  G.whiteT = Math.max(0, (G.whiteT || 0) - rdt);
  G.fireGlow = Math.max(0, (G.fireGlow || 0) - rdt * 3);
  G.comboPop = Math.max(0, G.comboPop - rdt * 6);
  if (G.combo > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
  if (G.banner) { G.banner.life += rdt; if (G.banner.life > G.banner.max) G.banner = null; }

  if (G.tut && G.state === 'fight') updateTutorial(rdt);

  if (G.state === 'intro') {
    G.introT -= rdt;
    if (G.introT <= 0) announceEnemy(curEnemy());
  } else if (G.state === 'announce') {   // 적 이름이 지나간 뒤에 싸움 시작
    G.introT -= rdt;
    if (G.introT <= 0) G.state = 'fight';
  } else if (G.state === 'clear' || G.state === 'dead') {
    G.endT -= rdt;
    // 보스 처치 직후: 멈추고 얻은 아이템을 화면 가운데에 보여줌 (아무 키나 누르면 계속)
    if (G.state === 'clear' && !G.itemShown && G.endT <= 1.6 && (G.newWeapon || G.newHeals || G.hpUp || G.unlocks.length)) { (G.newWeapon || G.newHeals || G.hpUp) ? showItemGet() : showUnlock(); return; }
    if (G.endT <= 0 && ui.classList.contains('hidden')) showResult(G.state === 'clear');
  }
}

// 반복 재생 효과음 (예: 달려오는 동안 run_sound). 공격하는 순간·일시정지·적이 바뀌면 멈춤
const loopAudio = {};
let loopPlaying = null;
function updateLoopSound() {
  const en = curEnemy();
  let want = null;
  if (!G.paused && G.state === 'fight' && en && en.state === 'fight' && en.def.chargeSound && en.lungeT < 0 && en.burstLeft === 0) want = en.def.chargeSound;
  if (want === loopPlaying) return;
  if (loopPlaying) loopAudio[loopPlaying].pause();
  loopPlaying = want;
  if (want) {
    const a = loopAudio[want] || (loopAudio[want] = Object.assign(new Audio(encodeURI(want)), { loop: true, volume: 0.8 }));
    a.muted = muted;
    a.currentTime = 0;
    a.play().catch(() => {});
  }
}

let last = performance.now();
function frame(now) {
  const rdt = clamp((now - last) / 1000, 0, 0.05); last = now;
  if (!G.paused) {
    let gdt = rdt;
    if (G.hitStop > 0) { G.hitStop -= rdt; gdt = 0; }
    update(gdt, rdt);
  }
  updateLoopSound();
  watchPerf(rdt);
  if (G.state !== 'menu') render();   // 타이틀 화면은 캔버스를 완전히 덮으니 그리지 않음
  requestAnimationFrame(frame);
}

// 성능 감시: 싸우는 중 2초 평균이 45fps 아래면 렌더 배율을 0.25씩 낮춤 (최소 1). 한 번 낮추면 다시 올리지 않음 (왔다 갔다 방지)
const perf = { t: 0, n: 0 };
function watchPerf(rdt) {
  if (G.paused || document.hidden || DPR <= DPR_MIN || !['intro', 'announce', 'fight'].includes(G.state)) { perf.t = perf.n = 0; return; }
  perf.t += rdt; perf.n++;
  if (perf.t < 2) return;
  const fps = perf.n / perf.t;
  perf.t = perf.n = 0;
  if (fps < 45) { dprCap = Math.max(DPR_MIN, DPR - 0.25); resize(); }
}

/* =====================================================================
   그리기
   ===================================================================== */
function applyCam(k = 1) {
  const z = 1 + cam.kz * k;
  ctx.translate(W / 2 + (cam.sx + cam.kx) * k, H / 2 + (cam.sy + cam.ky) * k);
  ctx.rotate(cam.rot * k); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 큰 축소는 전부 미리 그려 둔 캔버스(배경 · 적 사진)에서 처리하니, 매 프레임은 가벼운 보간으로 충분
  ctx.imageSmoothingQuality = 'medium';
  ctx.fillStyle = '#1b1a22'; ctx.fillRect(0, 0, W, H);

  ctx.save(); applyCam();
  const bg = bgFor(chapter().background);
  if (bg) ctx.drawImage(bg, -60, -60, W + 120, H + 120);
  if (G.state !== 'menu') { drawEnemies(); drawBus(); }
  ctx.restore();

  if (G.state !== 'menu') { drawEnemyBars(); drawOverlays(); }

  ctx.save(); applyCam(); drawNotes(); ctx.restore();
  ctx.save(); applyCam(0.35); drawHands(); ctx.restore();
  ctx.save(); applyCam(); drawSwings(); drawParts(); drawTexts(); ctx.restore();
  drawBullets();
  drawEnemyTop();

  drawScreenFx();
  drawHUD();
  drawDiscord();
  drawTutorial();
  drawBanner();
  drawCursor();
  if (G.whiteT > 0) {
    const left = G.whiteT, fade = WHITE_FLASH - WHITE_HOLD;
    ctx.fillStyle = `rgba(255,255,255,${left > fade ? 1 : left / fade})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawEnemies() {
  const list = G.enemies, i = G.idx;
  const en = list[i];
  // 바로 뒤에 겹쳐 있는 다음 우현 (데칼코마니처럼 두 장으로 나뉠 땐 안 보이게)
  if (list[i + 1] && !(en && en.def.mirror && en.state === 'fight')) ctx.drawImage(list[i + 1].img, EX - E / 2, EY - E / 2, E, E);
  if (!en) return;

  let x = enemyX(en) + en.escX, y = EY + en.escY;
  if (en.run) y -= Math.abs(Math.sin(G.time * 16)) * 16 * en.run;   // 달려오는 중 덜컹덜컹
  if (en.shakeT > 0) { x += rand(-1, 1) * en.shakeA; y += rand(-1, 1) * en.shakeA; }
  const left = en.def.cooldown - en.cd;
  const rushing = en.lungeT >= 0 && (en.strikeAt || 0) > 0.4 && !en.struck;   // 돌진 예고
  const warn = (en.state === 'fight' && G.state === 'fight' && left <= 0.7 && !en.def.door && !en.pat && en.def.cooldown > 0) || rushing;
  if (warn) { const a = rushing ? 10 : (1 - left / 0.7) * 6; x += rand(-a, a); y += rand(-a, a); }

  const sc = 1 + en.sc + en.lunge * 0.1 + (en.run || 0) * 0.12 + (en.state === 'out' ? (1 - en.alpha) * 0.04 : 0);
  const ai = en.def.ai && AI[en.def.ai], panic = en.def.panic && bullets.some(b => b.k === 'wp');
  ctx.save();
  ctx.globalAlpha = en.alpha;
  ctx.translate(x, y); ctx.rotate(en.rot + en.lean + (en.spin || 0));
  ctx.scale(sc * (1 + en.sq), sc * (1 - en.sq * 0.8));
  // 보통은 한 장, 데칼코마니는 진짜 + 거울(좌우 뒤집힘) 두 장
  const copies = en.def.mirror && en.state === 'fight' ? mirrorCopies(en) : [{ x: 0, size: E, flip: false, fake: false }];
  for (const c of copies) {
    const size = c.size, hs = size / 2;
    ctx.save(); ctx.translate(c.x, 0);
    if (warn) {
      ctx.shadowColor = 'rgba(255,30,30,0.95)'; ctx.shadowBlur = 30 + 20 * Math.sin(G.rt * 30);
      ctx.fillStyle = '#ff3030'; ctx.fillRect(-hs - 6, -hs - 6, size + 12, size + 12);
      ctx.shadowBlur = 0;
    }
    if (c.flip) { ctx.scale(-1, 1); drawEnemyImg(en, -hs, -hs, size); ctx.scale(-1, 1); }
    else drawEnemyImg(en, -hs, -hs, size);
    if (warn) { ctx.fillStyle = `rgba(255,0,0,${0.12 + 0.12 * Math.sin(G.rt * 25)})`; ctx.fillRect(-hs, -hs, size, size); }
    if (en.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, en.flash * 1.3) * 0.85})`; ctx.fillRect(-hs, -hs, size, size); }
    if (panic) { ctx.fillStyle = `rgba(60,220,130,${0.12 + 0.08 * Math.sin(G.rt * 8)})`; ctx.fillRect(-hs, -hs, size, size); }
    if (c.fake) drawMirrorSheen(size);
    if (ai && ai.drawLocal) ai.drawLocal(en, size);
    ctx.restore();
  }
  ctx.restore();
  if (en.stunT > 0) drawStun(en, x, y);
}

// 기절: 머리 위로 별이 빙글빙글
function drawStun(en, x, y) {
  const top = y - E * 0.42;
  for (let i = 0; i < 4; i++) {
    const a = G.rt * 4 + (i / 4) * TAU;
    outlinedText('★', x + Math.cos(a) * E * 0.22, top + Math.sin(a) * E * 0.05, 40, 'center', 'middle', '#fff7b0', '#ffd23a');
  }
  outlinedText(`기절! ${en.stunT.toFixed(1)}`, x, y + E * 0.36, 52, 'center', 'middle', '#ffffff', '#ffd23a');
}

function drawEnemyBars() {
  const en = curEnemy();
  if (!en || en.state === 'escape') return;
  const x0 = EX - E / 2, top = EY - E / 2 - BARS_H + 2;

  // 이름
  outlinedText(en.def.name, x0, top + 14, 26, 'left', 'middle', '#ffffff', '#ffd0e8');
  ctx.font = fontStr(26);
  let tx = x0 + ctx.measureText(en.def.name).width + 12;
  const tags = [];
  if (en.def.boss) tags.push(['BOSS', '#ff2a3d']);
  if (en.def.midboss) tags.push(['중간 보스', '#ff8a1a']);
  if (en.stunT > 0) tags.push(['기절', '#d4a20a']);
  else if (en.armor > 0) tags.push(['방어구', '#3d6fd6']);
  else if (en.def.evade) tags.push([`회피 ${Math.round(en.def.evade * 100)}%`, '#5b6178']);
  if (en.def.panic && bullets.some(b => b.k === 'wp')) tags.push(['회복 중', '#25a35a']);
  for (const [label, col] of tags) {
    ctx.font = fontStr(16);
    const tw = ctx.measureText(label).width + 18;
    ctx.fillStyle = col; rr(ctx, tx, top + 2, tw, 24, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, tx + tw / 2, top + 15);
    tx += tw + 6;
  }
  const left = Math.max(0, en.def.cooldown - en.cd), warn = G.state === 'fight' && en.state === 'fight' && left <= 0.7;
  ctx.font = fontStr(17); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillStyle = warn ? '#ff5050' : 'rgba(255,255,255,0.75)';
  let info = G.state === 'fight' && en.state === 'fight' ? `다음 공격 ${left.toFixed(1)}초` : '';
  if (en.def.door) info = '';
  else if (en.stunT > 0) info = `기절 ${en.stunT.toFixed(1)}초 — 지금 때려!`;
  else if (en.pat) info = `패턴: ${PATTERNS[en.pat.name].label}`;
  ctx.fillText(info, x0 + E, top + 15);

  // 체력
  const hy = top + 32, hh = 20;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; rr(ctx, x0 - 3, hy - 3, E + 6, hh + 6, 6); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x0, hy, E * en.hpChip / en.def.hp, hh);
  const gr = ctx.createLinearGradient(x0, 0, x0 + E, 0);
  gr.addColorStop(0, '#ff2a3d'); gr.addColorStop(1, '#ff7a3c');
  ctx.fillStyle = gr; ctx.fillRect(x0, hy, E * en.hp / en.def.hp, hh);
  if (en.armor > 0) {   // 방어구: 체력바 위쪽에 겹쳐서 푸른 강철색
    const ag = ctx.createLinearGradient(0, hy, 0, hy + hh * 0.5);
    ag.addColorStop(0, '#dbe9ff'); ag.addColorStop(1, '#4f86e8');
    ctx.fillStyle = ag; ctx.fillRect(x0, hy, E * en.armor / en.def.armor, hh * 0.5);
  }
  ctx.font = fontStr(16); ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#120008'; ctx.lineJoin = 'round';
  ctx.strokeText(`${fmt(en.hp)} / ${en.def.hp}`, EX, hy + hh / 2 + 1);
  ctx.fillStyle = '#fff'; ctx.fillText(`${fmt(en.hp)} / ${en.def.hp}`, EX, hy + hh / 2 + 1);

  // 공격 쿨타임
  const cy = hy + hh + 8, ch = 10;
  let ratio = G.state === 'fight' && en.state === 'fight' ? clamp(en.cd / en.def.cooldown, 0, 1) : 0;
  if (en.def.door) ratio = 1 - en.hp / en.def.hp;   // 문: 체력이 줄수록 폭발 게이지가 참
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; rr(ctx, x0 - 3, cy - 3, E + 6, ch + 6, 5); ctx.fill();
  ctx.fillStyle = warn ? (Math.sin(G.rt * 30) > 0 ? '#ff2020' : '#ffd23a') : '#ffb03c';
  ctx.fillRect(x0, cy, E * ratio, ch);
}

function drawNotes() {
  for (const n of notes) {
    const size = 64 * n.s;
    ctx.save();
    ctx.translate(n.x, n.y); ctx.rotate(n.rot + Math.sin(n.t * 12) * 0.2);
    ctx.font = `${Math.round(size)}px "Segoe UI Symbol", "Apple Symbols", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.shadowColor = n.color; ctx.shadowBlur = 24;
    ctx.lineWidth = size * 0.12; ctx.strokeStyle = '#1a0010'; ctx.strokeText(n.glyph, 0, 0);
    ctx.fillStyle = n.color; ctx.fillText(n.glyph, 0, 0);
    ctx.restore();
  }
}

// 광선검 칼날 (x, y: 손잡이 끝 = 주먹 위, ang: 방향)
function drawBlade(x, y, ang, len, glow) {
  const ux = Math.cos(ang), uy = Math.sin(ang), ex = x + ux * len, ey = y + uy * len;
  ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(0,0,0,0)';
  ctx.strokeStyle = '#2b2d33'; ctx.lineWidth = 18; ctx.beginPath(); ctx.moveTo(x - ux * 10, y - uy * 10); ctx.lineTo(x + ux * 34, y + uy * 34); ctx.stroke();
  ctx.strokeStyle = '#9aa0ab'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(x - ux * 6, y - uy * 6); ctx.lineTo(x + ux * 30, y + uy * 30); ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = `rgb(${glow})`; ctx.shadowBlur = 30;
  for (const [lw, a] of [[34, 0.16], [22, 0.35], [13, 0.7]]) {
    ctx.strokeStyle = `rgba(${glow},${a})`; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x + ux * 36, y + uy * 36); ctx.lineTo(ex, ey); ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x + ux * 38, y + uy * 38); ctx.lineTo(ex - ux * 4, ey - uy * 4); ctx.stroke();
  ctx.restore();
}
// 휘두른 자리에 남는 빛 (부채꼴)
function drawSlashTrail(x, y, a0, a1, len, glow) {
  if (Math.abs(a1 - a0) < 0.05) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, len * 0.3, x, y, len);
  g.addColorStop(0, `rgba(${glow},0)`); g.addColorStop(1, `rgba(${glow},0.22)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, len, Math.min(a0, a1), Math.max(a0, a1)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHands() {
  const w = weapon(), sp = w.sprites, bob = 8 + Math.sin(G.rt * 2.2) * 6, fl = Math.max(0, P.flinch);

  // 왼손: 평소 left, 우클릭 누르는 동안 left_guard (카운터 자세 그림이 없는 무기는 카운터 중에도)
  const leftSwing = RHs.state === 'punch' && RHs.side === 'L' && sp.leftAttackFrames && !(w.counter && P.poseT > 0 && w.counter.pose);
  if (leftSwing) {   // 양손 무기의 왼손 베기 (화면 왼쪽 아래 기준)
    const f = sp.leftAttackFrames.find(fr => fr.until == null || RHs.t < fr.until), im = IMG[f.src];
    if (im) {
      let ox = 0, oy = fl;
      if (RHs.hit) { const k = Math.max(0, 1 - (RHs.t - swingOf().impact) / swingOf().hold); ox -= 14 * k; oy += 10 * k; }   // 맞힌 반동
      ctx.drawImage(im, ox, H - im.naturalHeight + oy);
    }
  } else if (LHs.state === 'guard' || (w.counter && !w.counter.pose && P.poseT > 0)) {
    const im = IMG[sp.guard];
    if (im) {
      const e = easeOutCubic(clamp(LHs.t / 0.07, 0, 1));
      let ox = lerp(-90, 0, e), oy = lerp(90, 0, e) + LHs.push + fl * 0.5;
      if (LHs.shakeT > 0) { ox += rand(-6, 6); oy += rand(-6, 6); }
      ctx.drawImage(im, ox, H - im.naturalHeight + oy);
    }
  } else {
    const im = IMG[sp.guardIdle];
    if (im) {
      let ox = 0, oy = bob + fl;
      if (LHs.state === 'lower') { const e = easeOutCubic(clamp(LHs.t / 0.14, 0, 1)); ox = lerp(-40, 0, e); oy += lerp(80, 0, e); }
      ctx.drawImage(im, ox, H - im.naturalHeight + oy);
    }
  }

  // 오른손: 평소 right, 좌클릭하면 잠깐 right_attack
  const charged = P.bonus > 0;
  if (charged) { ctx.shadowColor = 'rgba(255,140,40,0.95)'; ctx.shadowBlur = 26 + 10 * Math.sin(G.rt * 10); }
  const pose = w.counter && P.poseT > 0 && IMG[w.counter.pose];
  if (RHs.state === 'ult' && G.ult) {
    const fr = G.ult.def.frames, f = fr.find(x => RHs.t < x.until) || fr[fr.length - 1], im = IMG[f.src];
    if (im) ctx.drawImage(im, W - im.naturalWidth, H - im.naturalHeight + fl);
  } else if (pose) {
    // 카운터 자세: 1920x1080 화면 기준 그림을 오른쪽 위에 맞춰 화면 크기에 맞게
    const s = Math.max(W / 1920, H / 1080), e = easeOutCubic(clamp((w.counter.window - P.poseT) / 0.03, 0, 1));
    let ox = lerp(80, 0, e), oy = lerp(-60, 0, e);
    if (P.counterT <= 0 && G.blockT > 0.6) { ox += rand(-8, 8); oy += rand(-8, 8); }   // 막은 직후 덜덜
    ctx.drawImage(pose, W - 1920 * s + ox, oy, 1920 * s, 1080 * s);
    if (P.counterT > 0) edgeGlow('120,200,255', 0.35);
  } else if (RHs.state === 'punch' && sp.attackFrames && RHs.side !== 'L') {
    // 프레임 애니메이션 무기 (검집: 휘두름 → 타격)
    const f = sp.attackFrames.find(fr => fr.until == null || RHs.t < fr.until), im = IMG[f.src];
    if (im) {
      let ox = 0, oy = fl;
      if (RHs.hit) { const k = Math.max(0, 1 - (RHs.t - swingOf().impact) / swingOf().hold); ox += 14 * k; oy += 10 * k; }  // 맞힌 반동
      ctx.drawImage(im, W - im.naturalWidth + ox, H - im.naturalHeight + oy);
    }
  } else if (RHs.state === 'punch' && RHs.side !== 'L') {
    const im = IMG[sp.attack];
    if (im) {
      const iw = im.naturalWidth, ih = im.naturalHeight;
      const e = easeOutCubic(clamp(RHs.t / PUNCH_EXT, 0, 1));
      if (e < 1) {   // 뻗는 중 잔상
        ctx.save(); ctx.shadowBlur = 0;
        for (let k = 1; k <= 2; k++) {
          const pe = Math.max(0, e - k * 0.3), s = lerp(0.88, 1, pe);
          ctx.globalAlpha = 0.25 / k;
          ctx.drawImage(im, W - iw * s + lerp(110, 0, pe), H - ih * s + lerp(130, 0, pe) + fl, iw * s, ih * s);
        }
        ctx.restore();
      }
      const s = lerp(0.88, 1, e);
      let ox = lerp(110, 0, e), oy = lerp(130, 0, e) + fl;
      if (RHs.hit) { const k = Math.max(0, 1 - (RHs.t - PUNCH_EXT) / PUNCH_HOLD); ox += 10 * k; oy += 12 * k; }  // 맞힌 반동
      ctx.drawImage(im, W - iw * s + ox, H - ih * s + oy, iw * s, ih * s);
      if (w.blade) {
        const fx = W - iw * s + ox + iw * s * 0.06, fy = H - ih * s + oy + ih * s * 0.12;
        const aim = Math.atan2(RHs.ty - fy, RHs.tx - fx), a0 = aim - 1.4, a = lerp(a0, aim + 0.25, easeOutCubic(clamp(RHs.t / 0.09, 0, 1)));
        drawSlashTrail(fx, fy, Math.max(a0, a - 0.7), a, 620, w.blade.glow);
        drawBlade(fx, fy, a, 620, w.blade.glow);
      }
    }
  } else {
    const im = IMG[sp.idle];
    if (im) {
      let ox = 0, oy = bob + fl + (w.blade ? 150 : 0);   // 광선검: 칼날이 화면에 보이게 손을 조금 내림
      if (RHs.state === 'recover' && RHs.side !== 'L') { const e = easeOutCubic(clamp(RHs.t / PUNCH_REC, 0, 1)); ox = lerp(50, 0, e); oy += lerp(70, 0, e); }
      ctx.drawImage(im, W - im.naturalWidth + ox, H - im.naturalHeight + oy);
      if (w.blade) drawBlade(W - im.naturalWidth + ox + im.naturalWidth * 0.2, H - im.naturalHeight + oy + im.naturalHeight * 0.04, -Math.PI / 2 - 0.35 + Math.sin(G.rt * 2.2) * 0.03, 560, w.blade.glow);
    }
  }
  ctx.shadowBlur = 0;
}

function drawBurst(p, t) {
  const sc = t < 0.35 ? lerp(0.55, 1.08, easeOutCubic(t / 0.35)) : 1.08 - (t - 0.35) * 0.15;
  const n = p.pts.length;
  const path = k => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU, r = p.pts[i] * p.r * sc * k;
      if (i) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  };
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
  ctx.globalAlpha = t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1;
  path(1); ctx.fillStyle = p.big ? '#ff6a2a' : '#ffd23a'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#1a0008'; ctx.stroke();
  path(0.62); ctx.fillStyle = '#fff7d0'; ctx.fill();
  path(0.32); ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.restore();
}

function drawParts() {
  for (const p of parts) {
    const t = p.life / p.max;
    if (p.t === 'flash') {
      ctx.globalCompositeOperation = 'lighter';
      const r = p.r * (0.5 + 0.5 * easeOutCubic(t));
      ctx.globalAlpha = 1 - t;
      ctx.drawImage(p.blue ? SPR.flashBlue : SPR.flash, p.x - r, p.y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.t === 'ring') {
      ctx.strokeStyle = `rgba(${p.color},${p.a * (1 - t)})`; ctx.lineWidth = Math.max(0.5, p.w * (1 - t));
      ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.r0, p.r1, easeOutCubic(t)), 0, TAU); ctx.stroke();
    } else if (p.t === 'burst') {
      drawBurst(p, t);
    } else if (p.t === 'spark') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(${p.color},${1 - t})`; ctx.lineWidth = p.w * (1 - t * 0.7); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.t === 'chip') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = 1 - t * t;
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.7);
      ctx.restore();
    } else if (p.t === 'dust') {
      ctx.fillStyle = `rgba(220,210,230,${0.4 * (1 - t)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + t * 1.5), 0, TAU); ctx.fill();
    } else if (p.t === 'fire') {
      ctx.globalCompositeOperation = 'lighter';
      const r = p.r * (1 + t * 4);
      ctx.globalAlpha = 1 - t;
      ctx.drawImage(SPR.fire, p.x - r, p.y - r, r * 2, r * 2);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

function outlinedText(str, x, y, size, align, base, c1, c2) {
  ctx.font = fontStr(size); ctx.textAlign = align; ctx.textBaseline = base; ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.22; ctx.strokeStyle = '#120008'; ctx.strokeText(str, x, y);
  const top = base === 'top' ? y : base === 'bottom' ? y - size : y - size / 2;
  const g = ctx.createLinearGradient(0, top, 0, top + size);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillText(str, x, y);
}

function drawTexts() {
  for (const t of texts) {
    const p = t.life;
    const sc = p < 0.05 ? lerp(2.2, 0.85, p / 0.05) : p < 0.1 ? lerp(0.85, 1, (p - 0.05) / 0.05) : 1;   // 쾅 하고 튀어나옴
    ctx.save();
    ctx.globalAlpha = clamp((t.max - p) / 0.2, 0, 1);
    ctx.translate(t.x, t.y); ctx.rotate(t.rot); ctx.scale(sc, sc);
    outlinedText(t.str, 0, 0, t.size, 'center', 'middle', t.c1, t.c2);
    ctx.restore();
  }
}

function edgeGlow(color, alpha) {
  if (!(alpha > 0)) return;
  const ga = ctx.globalAlpha;
  ctx.globalAlpha = ga * Math.min(1, alpha);
  ctx.drawImage(glowFor(color), 0, 0, W, H);   // 미리 그려 둔 비네트 (glowFor)
  ctx.globalAlpha = ga;
}

function drawScreenFx() {
  if (G.focus) {   // 만화식 집중선 (반격 때)
    const f = G.focus, a = (1 - f.life / f.max) * 0.55, R = Math.hypot(W, H);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    for (let i = 0; i < 70; i++) {
      const ang = Math.random() * TAU, r0 = R * rand(0.28, 0.45), w = rand(0.004, 0.012);
      ctx.beginPath();
      ctx.moveTo(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0);
      ctx.lineTo(f.x + Math.cos(ang - w) * R, f.y + Math.sin(ang - w) * R);
      ctx.lineTo(f.x + Math.cos(ang + w) * R, f.y + Math.sin(ang + w) * R);
      ctx.closePath(); ctx.fill();
    }
  }
  if (P.guarding) edgeGlow('90,180,255', 0.28);
  if (CUR.mirror > 0) edgeGlow('170,80,255', 0.4);   // 좌우 반전 중
  if (G.fireGlow > 0) edgeGlow('255,110,0', 0.45 * G.fireGlow);
  if (G.blockT > 0) edgeGlow('150,220,255', 0.5 * G.blockT);
  if (G.hurtT > 0) edgeGlow('255,0,20', 0.75 * G.hurtT);
  if ((G.state === 'fight' || G.state === 'announce') && P.hp <= 30) edgeGlow('200,0,20', 0.22 * (0.5 + 0.5 * Math.sin(G.rt * 7)));
}

function bar(x, y, w, h, ratio, color, bg = 'rgba(0,0,0,0.6)') {
  ctx.fillStyle = bg; rr(ctx, x - 3, y - 3, w + 6, h + 6, 6); ctx.fill();
  ctx.fillStyle = color; ctx.fillRect(x, y, w * clamp(ratio, 0, 1), h);
}

function drawHUD() {
  if (G.state === 'menu') return;
  const w = weapon(), g = guardOf(), x = 20, bw = Math.min(300, W * 0.26);

  // 플레이어 체력
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.font = fontStr(17); ctx.fillStyle = '#fff';
  ctx.fillText(`HP  ${fmt(P.hp)} / ${maxHp()}${player.god ? '  (GODMODE)' : ''}`, x, 36);
  bar(x, 42, bw, 16, P.hp / maxHp(), P.hp <= 30 ? '#ff2a3d' : '#5be07a');

  // 가드 게이지 (가드 능력이 있는 무기만)
  let ratio = 0, col = '#6b6f80', label = '가드 없음';
  const cw = weapon().counter;
  if (cw) {
    if (P.counterT > 0) { ratio = 1; col = '#ffffff'; label = '카운터!'; }
    else if (P.counterCd > 0) { ratio = 1 - P.counterCd / cw.cooldown; label = `카운터 쿨타임  ${P.counterCd.toFixed(1)}초`; }
    else { ratio = 1; col = '#5ac8ff'; label = '카운터 준비 (우클릭)'; }
  }
  else if (!g) {}
  else if (P.guarding) { ratio = 1 - P.guardT / g.maxHold; col = '#5ac8ff'; label = `가드 중  ${(g.maxHold - P.guardT).toFixed(1)}초`; }
  else if (P.guardCd > 0) { ratio = 1 - P.guardCd / P.guardCdMax; col = '#6b6f80'; label = `가드 쿨타임  ${P.guardCd.toFixed(1)}초`; }
  else { ratio = 1; col = '#5ac8ff'; label = '가드 준비 (우클릭)'; }
  ctx.font = fontStr(15); ctx.fillStyle = (cw ? P.counterCd : P.guardCd) > 0 ? '#aab' : '#bfe6ff'; ctx.textBaseline = 'bottom';
  ctx.fillText(label, x, 86);
  bar(x, 92, bw, 10, ratio, col);

  // 반격 보너스
  if (P.bonus > 0) {
    const s = 1 + 0.06 * Math.sin(G.rt * 10);
    ctx.save(); ctx.translate(x, 132); ctx.scale(s, s);
    outlinedText(`다음 주먹 +${fmt(P.bonus)}`, 0, 0, 24, 'left', 'middle', '#fff27a', '#ff7a1a');
    ctx.restore();
  }

  // 오른쪽 위: 챕터 정보
  ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = fontStr(20); ctx.fillStyle = '#fff';
  ctx.fillText(`${chapter().label} · ${chapter().name}`, W - 20, 16);
  ctx.font = fontStr(15); ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(`적 ${Math.min(G.idx + 1, G.enemies.length)} / ${G.enemies.length}   ·   무기: ${w.name} (공격력 ${w.damage})`, W - 20, 44);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText(`I 인벤토리   ·   M ${muted ? '소리 켜기' : '소리 끄기'}`, W - 20, 66);

  // 콤보
  if (G.combo >= 3) {
    const cs = 64 * (1 + G.comboPop * 0.4);
    ctx.save();
    ctx.globalAlpha = clamp(G.comboT / 0.3, 0, 1);
    ctx.translate(W - 30, H * 0.36); ctx.rotate(-0.08);
    outlinedText(String(G.combo), 0, 0, cs, 'right', 'middle', '#ffffff', '#9fd8ff');
    outlinedText('COMBO', 0, 40, 22, 'right', 'top', '#ffffff', '#cccccc');
    ctx.restore();
  }
}

function drawBanner() {
  const b = G.banner; if (!b) return;
  const p = b.life, sc = p < 0.3 ? easeOutBack(p / 0.3) : 1;
  ctx.save();
  ctx.globalAlpha = p > b.max - 0.35 ? Math.max(0, (b.max - p) / 0.35) : 1;
  ctx.translate(W / 2, H * 0.36); ctx.scale(sc, sc);
  const size = Math.min(W * 0.12, 110);
  outlinedText(b.title, 0, 0, size, 'center', 'middle', '#ffffff', b.color);
  if (b.sub) outlinedText(b.sub, 0, size * 0.85, size * 0.42, 'center', 'middle', '#ffffff', '#ffd0e8');
  if (b.hint) outlinedText(b.hint, 0, size * (b.sub ? 1.45 : 1.0), Math.min(size * 0.3, W / (b.hint.length * 1.1)), 'center', 'middle', '#ffffff', '#ffe27a');
  ctx.restore();
}

/* ---------- 조준점 커서 ----------
   평소: OS 하드웨어 커서를 조준점 SVG로 바꿔서 보여줌 → 게임 프레임이 밀려도 마우스는 지연 없이 따라옴
   커서가 밀리거나(바람 · 덜컹 · 흡입) 좌우 반전된 동안: 게임 속 위치가 진짜 마우스와 다르니 캔버스에 조준점을 그리고,
   하드웨어 커서는 진짜 마우스 위치를 알려주는 점선 원으로 바꿈 (전투 중 기본 화살표는 절대 안 보임) */
function crosshairSvg(r, col, alpha) {
  const S = 64, c = S / 2, t1 = r + 4, t2 = r + 11;
  const ticks = `M${c + t1} ${c}H${c + t2}M${c - t1} ${c}H${c - t2}M${c} ${c + t1}V${c + t2}M${c} ${c - t1}V${c - t2}`;
  const shape = (stroke, w) => `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${stroke}" stroke-width="${w}"/><path d="${ticks}" fill="none" stroke="${stroke}" stroke-width="${w}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"><g opacity="${alpha}">`
    + `${shape('rgba(0,0,0,0.55)', 4.5)}<circle cx="${c}" cy="${c}" r="3.6" fill="rgba(0,0,0,0.55)"/>`   // 그림자 대신 어두운 테두리
    + `${shape(col, 2.5)}<circle cx="${c}" cy="${c}" r="2.5" fill="${col}"/></g></svg>`;
}
const svgCursor = (svg, hot, fallback) => `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${hot} ${hot}, ${fallback}`;
const CURSOR = {
  white: svgCursor(crosshairSvg(16, 'rgba(255,255,255,0.92)', 1), 32, 'crosshair'),
  red: svgCursor(crosshairSvg(13, '#ff3b3b', 1), 32, 'crosshair'),
  whiteDim: svgCursor(crosshairSvg(16, 'rgba(255,255,255,0.92)', 0.3), 32, 'crosshair'),   // 무적시간 깜빡임
  redDim: svgCursor(crosshairSvg(13, '#ff3b3b', 0.3), 32, 'crosshair'),
  ghost: svgCursor('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 4"/></svg>', 16, 'none'),
  hidden: 'none',
};
let hwCursor = '';
function setHwCursor(v) { if (v !== hwCursor) { hwCursor = v; cvs.style.cursor = v; } }

// 캔버스에 그리는 조준점 (커서가 밀리거나 반전됐을 때만). shadowBlur 대신 어두운 테두리를 한 번 더 그림
function drawCrosshair(x, y, r, col) {
  ctx.save();
  ctx.translate(x, y);
  for (const [w, c] of [[4.5, 'rgba(0,0,0,0.55)'], [2.5, col]]) {
    ctx.lineWidth = w; ctx.strokeStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
    ctx.moveTo(r + 4, 0); ctx.lineTo(r + 11, 0); ctx.moveTo(-r - 4, 0); ctx.lineTo(-r - 11, 0);
    ctx.moveTo(0, r + 4); ctx.lineTo(0, r + 11); ctx.moveTo(0, -r - 4); ctx.lineTo(0, -r - 11);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, TAU); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawCursor() {
  if (G.state === 'menu' || G.paused) return;
  const blink = P.iframe > 0 && Math.floor(G.rt * 20) % 2;   // 맞은 직후 무적시간엔 커서가 깜빡임
  const en = curEnemy(), on = en && en.state === 'fight' && inEnemy(mouse.x, mouse.y);
  const manual = Math.abs(rawMouse.x - mouse.x) > 0.5 || Math.abs(rawMouse.y - mouse.y) > 0.5;
  if (!manual) setHwCursor(blink ? (on ? CURSOR.redDim : CURSOR.whiteDim) : on ? CURSOR.red : CURSOR.white);
  else {
    // 진짜 마우스 위치는 하드웨어 점선 원으로 (멀리 밀렸을 때만), 게임 속 커서는 캔버스에
    setHwCursor(Math.hypot(rawMouse.x - mouse.x, rawMouse.y - mouse.y) > 24 ? CURSOR.ghost : CURSOR.hidden);
    if (!blink) drawCrosshair(mouse.x, mouse.y, on ? 13 : 16, on ? '#ff3b3b' : 'rgba(255,255,255,0.92)');
  }
  if (blink) return;
  const ab = weapon().ability;
  if (ab && ab.beat && G.state === 'fight') {
    const ph = (G.rt % ab.beat) / ab.beat, hit = ph < ab.beatWin / ab.beat || ph > 1 - ab.beatWin / ab.beat;
    ctx.save(); ctx.strokeStyle = hit ? '#ffffff' : `rgba(255,45,85,${0.25 + ph * 0.6})`; ctx.lineWidth = hit ? 4 : 2.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, hit ? 20 : 20 + (1 - ph) * 36, 0, TAU); ctx.stroke(); ctx.restore();
  }
  if (CUR.mirror > 0) outlinedText(`⇆ 반전 ${CUR.mirror.toFixed(1)}`, mouse.x, mouse.y + 36, 20, 'center', 'middle', '#ffffff', '#b45cff');
}

/* =====================================================================
   인벤토리
   ===================================================================== */
const inv = document.getElementById('inv');
const equipWeapon = document.getElementById('equipWeapon'), invHp = document.getElementById('invHp');
const bag = document.getElementById('bag'), gradesEl = document.getElementById('grades'), detail = document.getElementById('detail');
const BAG_SLOTS = 40;   // 가방 칸 수 (4 x 10, 스크롤)
const invUI = { cat: 'weapon', sel: null };   // 지금 보고 있는 카테고리, 선택한 아이템 id

const weaponId = () => (WEAPONS[player.equipped] ? player.equipped : DEFAULT_WEAPON);
const gradeOf = w => GRADES[w.grade] || GRADES.common;
const weaponIcon = w => w.icon || w.sprites.idle;
const healIds = () => Object.keys(player.heals).filter(id => HEALS[id] && player.heals[id] > 0);

function guardHtml(w) {
  const g = w.guard;
  if (w.counter || w.ult) return '';
  if (!g) return '<div class="ability none">가드 불가</div>';
  return `<div class="ability" style="border-color:#3a3150;background:none"><h4 style="color:#bbb">가드 · 우클릭 누르고 있기</h4><ul>
    <li>최대 ${g.maxHold}초까지 유지</li><li>쿨타임: 든 시간만큼 (최소 ${g.cooldownMin}초)</li><li>가드 중엔 공격 불가</li></ul></div>`;
}
function abilityHtml(w) {
  const ab = w.ability;
  if (!ab) return '<div class="ability none">고유 능력 없음</div>';
  const lines = [];
  if (ab.guardReduction) lines.push(`가드 중 받는 피해 ${Math.round(ab.guardReduction * 100)}% 감소`);
  if (ab.counterRatio) lines.push(`가드 중 맞은 피해의 ${Math.round(ab.counterRatio * 100)}%를 다음 공격에 추가`);
  if (w.counter) {
    const c = w.counter;
    lines.push('조작: 우클릭', `누르면 ${c.window}초 동안 카운터 자세`, '그 사이 공격을 맞으면 피해 무효',
      `받은 피해의 ${Math.round(c.reflect * 100)}%를 적에게 반사`, `실패하면 쿨타임 ${c.cooldown}초, 성공하면 바로 다시 사용 가능`);
  }
  if (ab.desc) lines.push(ab.desc);
  return `<div class="ability"><h4>고유 능력 · ${ab.name}</h4><ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul></div>`;
}

// 선택한 아이템 사용: 무기는 장착(장착 중이면 해제), 힐템은 먹기
function useSelected() {
  if (invUI.cat === 'weapon') {
    const id = invUI.sel || weaponId();
    if (!WEAPONS[id]) return;
    player.equipped = (id === DEFAULT_WEAPON || weaponId() === id) ? null : id;
    P.guarding = false; P.counterT = 0; LHs.state = 'idle';
    saveGame();
    SFX.guardUp();
  } else {
    const id = invUI.sel || healIds()[0], h = HEALS[id];
    if (!h || !(player.heals[id] > 0)) return;
    if (invUI.menu) { SFX.deny(); toast('힐템은 전투 중에 사용할 수 있어요'); return; }
    if (P.hp >= maxHp()) { SFX.deny(); return; }
    const got = Math.min(h.heal, maxHp() - P.hp);
    P.hp += got;
    player.heals[id]--;
    if (player.heals[id] <= 0) invUI.sel = null;
    texts.push({ str: `+${fmt(got)}`, x: W / 2, y: H * 0.62, vx: 0, vy: -200, size: 60, life: 0, max: 1.2, rot: 0, c1: '#eaffea', c2: '#3ddc84' });
    SFX.clear();
  }
  renderInv();
}

function renderDetail() {
  if (invUI.cat === 'weapon') {
    const id = invUI.sel || weaponId(), w = WEAPONS[id], gr = gradeOf(w), on = weaponId() === id;
    detail.innerHTML = `
      <img class="dimg" src="${encodeURI(weaponIcon(w))}" alt="">
      <div class="dname" style="color:${gr.color}">${w.name}</div>
      <span class="badge" style="background:${gr.color}">${gr.name}</span>
      <p>${w.desc || ''}</p>
      <div class="wstats">
        <div><span>공격력</span><b>${w.damage}</b></div>
        <div><span>연타 간격</span><b>${w.attackInterval}초</b></div>
      </div>
      ${abilityHtml(w)}
      <div style="height:10px"></div>
      ${guardHtml(w)}
      <div class="small">${on ? '장착 중' : '더블클릭 또는 F: 장착'}${on && id !== DEFAULT_WEAPON ? ' · 더블클릭 또는 F: 해제' : ''}</div>`;
  } else {
    const id = invUI.sel || healIds()[0], h = HEALS[id];
    if (!h) { detail.innerHTML = '<p>가진 힐템이 없어요.</p>'; return; }
    detail.innerHTML = `
      <img class="dimg" src="${encodeURI(h.img)}" alt="">
      <div class="dname" style="color:${gradeOf(h).color}">${h.name}</div>
      <span class="badge" style="background:${gradeOf(h).color}">${gradeOf(h).name}</span>
      <p>${h.desc || ''}</p>
      <div class="wstats">
        <div><span>회복량</span><b>${h.heal}</b></div>
        <div><span>${invUI.menu ? '챕터 시작 개수' : '남은 개수'}</span><b>${player.heals[id] || 0}개</b></div>
      </div>
      <div class="small">${invUI.menu ? '전투 중에 인벤토리(I)에서 사용' : '더블클릭 또는 F: 사용'}</div>`;
  }
}

function renderInv() {
  invHp.textContent = invUI.menu ? `타이틀 화면 · 최대 HP ${maxHp()}` : `일시정지 중 · HP ${fmt(P.hp)} / ${maxHp()}`;

  // 무기 장착칸
  const w = weapon(), gr = gradeOf(w);
  equipWeapon.style.borderColor = gr.color;
  equipWeapon.innerHTML = `<img src="${encodeURI(weaponIcon(w))}" alt=""><div><b style="color:${gr.color}">${w.name}</b><small>${gr.name}${player.equipped ? '' : ' · 기본 무기'}</small></div>`;

function chapterCard(id, fallbackLabel) {
  const i = CHAPTERS.findIndex(c => c.id === id), ch = CHAPTERS[i], b = document.createElement('button');
  if (!ch) {   // 아직 없는 챕터
    b.className = 'chapter-card dev';

    b.addEventListener('click', () => { SFX.deny(); toast('아직 개발중인 챕터예요'); });
    return { b, open: false };
  }
  const open = isUnlocked(ch), need = CHAPTERS.find(c => c.id === ch.requires);
  b.className = 'chapter-card' + (open ? '' : ' locked');
  b.innerHTML = `<div class="thumb" style="background-image:url('${encodeURI(ch.thumb || ch.background || '')}')"></div>
    <div class="info"><small>${ch.label}${isCleared(ch.id) ? '<span class="done">✔</span>' : ''}</small><b>${ch.name}</b>
    ${open ? '' : `<span class="lock">🔒 ${need ? need.label : ''} 클리어 필요</span>`}</div>`;
  b.addEventListener('click', () => {
    if (!open) { SFX.deny(); toast(`먼저 클리어해야 열려요: ${need ? need.label : '이전 챕터'}`); return; }
    begin(i);

}
// 챕터 지도: 마우스로 끌어서 가로 스크롤, 놓으면 살짝 미끄러지다 멈춤. 끌었을 땐 카드 클릭으로 안 침. 휠은 가로로 넘김
const chapterMap = document.getElementById('chapterMap');
{
  let down = false, sx = 0, sl = 0, moved = 0, vx = 0, lx = 0, lt = 0, glideId = 0;
  chapterMap.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    down = true; sx = lx = e.clientX; sl = chapterMap.scrollLeft; moved = 0; vx = 0; lt = performance.now();
    cancelAnimationFrame(glideId);
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx, now = performance.now();
    moved = Math.max(moved, Math.abs(dx));
    if (moved > 6) chapterMap.classList.add('dragging');
    chapterMap.scrollLeft = sl - dx;
    vx = lerp(vx, (e.clientX - lx) / Math.max(1, now - lt), 0.5); lx = e.clientX; lt = now;
  });
  window.addEventListener('pointerup', () => {
    if (!down) return;
    down = false; chapterMap.classList.remove('dragging');
    let v = -vx * 16;   // 놓을 때 속도로 조금 더 미끄러짐
    const glide = () => { if (Math.abs(v) < 0.5) return; chapterMap.scrollLeft += v; v *= 0.92; glideId = requestAnimationFrame(glide); };
    if (moved > 6) glide();
  });
  chapterMap.addEventListener('click', e => { if (moved > 6) { e.stopPropagation(); e.preventDefault(); } }, true);
  chapterMap.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    chapterMap.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive: false });
}
function showChapters() {
  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  list.style.setProperty('--cols', CHAPTER_MAP.length);
  const hasTop = CHAPTER_MAP.some(m => m.side && m.sideAt === 'top'), mainRow = hasTop ? 2 : 1;
  const LINE_ON = '#e9e4f5', LINE_OFF = '#4a4060';
  let focus = null;
  CHAPTER_MAP.forEach((m, col) => {
    const node = document.createElement('div'), { b, open } = chapterCard(m.id, m.label);
    node.className = 'node main' + (col === CHAPTER_MAP.length - 1 ? ' last' : '');
    node.style.gridColumn = col + 1; node.style.gridRow = mainRow;
    const next = CHAPTER_MAP[col + 1], nextCh = next && CHAPTERS.find(c => c.id === next.id);
    node.style.setProperty('--line', nextCh && isUnlocked(nextCh) ? LINE_ON : LINE_OFF);   // 다음 챕터가 열렸으면 밝은 선
    node.appendChild(b); list.appendChild(node);
    if (open) focus = node;
    if (m.side) {
      const sn = document.createElement('div'), sc = chapterCard(m.side, m.sideLabel), sideCh = CHAPTERS.find(c => c.id === m.side);
      sn.className = `node side ${m.sideAt}`;
      sn.style.gridColumn = col + 1; sn.style.gridRow = m.sideAt === 'top' ? mainRow - 1 : mainRow + 1;
      sn.style.setProperty('--line', sideCh && isUnlocked(sideCh) ? LINE_ON : LINE_OFF);
      sn.appendChild(sc.b); list.appendChild(sn);
    }
  });
  chaptersEl.classList.remove('hidden');
  // 마지막으로 열린 메인 챕터가 가운데 오게
  chapterMap.scrollLeft = 0;
  if (focus) { const r = focus.getBoundingClientRect(), m = chapterMap.getBoundingClientRect(); chapterMap.scrollLeft = r.left + r.width / 2 - (m.left + m.width / 2); }
}

const COMMANDS = {
  godmode: arg => {
    const on = (arg || '').trim();
    if (on !== '1' && on !== '0') return null;
    player.god = on === '1';
    const inGame = ['intro', 'announce', 'fight'].includes(G.state);
    let extra = '';
    if (player.god) {
      if (!player.weapons.includes('godfist')) { player.weapons.push('godfist'); extra = '\n무기 획득: 개발자 주먹 (I 인벤토리에서 장착)'; }
      if (inGame) P.hp = GOD_HP;
    } else {   // 끄면 개발자 주먹도 회수 (장착 중이면 기본 주먹으로)
      if (player.weapons.includes('godfist')) { player.weapons = player.weapons.filter(id => id !== 'godfist'); extra = '\n개발자 주먹 회수'; }
      if (player.equipped === 'godfist') player.equipped = null;
      if (inGame) P.hp = Math.min(P.hp, maxHp());
    }
    saveGame();
    return (player.god ? `godmode 켜짐: 체력 ${GOD_HP}` : `godmode 꺼짐: 체력 ${maxHp()}`) + extra;
  },
  give: arg => {
    const key = (arg || '').replace(/\s+/g, '').toLowerCase();
    if (!key) return null;
    const ids = key === 'all' ? Object.keys(WEAPONS)
      : Object.keys(WEAPONS).filter(id => id === key || WEAPONS[id].name.replace(/\s+/g, '').toLowerCase() === key);
    if (!ids.length) return null;
    const got = ids.filter(id => !player.weapons.includes(id));
    player.weapons.push(...got); saveGame();
    return got.length ? `무기 획득: ${got.map(id => WEAPONS[id].name).join(', ')}` : `이미 가지고 있어요: ${ids.map(id => WEAPONS[id].name).join(', ')}`;
  },
  clear: arg => {
    const list = findChapters(arg);
    if (!list) return null;
    const got = list.map(markCleared).filter(Boolean);
    return `클리어 처리: ${list.map(c => c.label).join(', ')}${got.length ? `\n무기 획득: ${got.map(id => WEAPONS[id].name).join(', ')}` : ''}`;
  },
  unclear: arg => {
    const list = findChapters(arg);
    if (!list) return null;
    player.cleared = player.cleared.filter(id => !list.some(c => c.id === id)); saveGame();
    return `클리어 기록 삭제: ${list.map(c => c.label).join(', ')}`;
  },
  damage: arg => {
    const n = Number((arg || '').trim());
    if (!(n > 0)) return null;
    const en = curEnemy();
    if (!en || G.state === 'menu' || G.state === 'clear' || G.state === 'dead' || en.state !== 'fight') return null;
    dealEnemy(en, n);
    if (en.state !== 'fight') return `${en.def.name}에게 ${fmt(n)} 피해 → 쓰러뜨림!`;
    return `${en.def.name}에게 ${fmt(n)} 피해 → 체력 ${fmt(en.hp)} / ${en.def.hp}${en.armor > 0 ? `  (방어구 ${fmt(en.armor)})` : ''}`;
  },
  status: () => `클리어: ${player.cleared.map(id => (CHAPTERS.find(c => c.id === id) || {}).label || id).join(', ') || '없음'}\n무기: ${player.weapons.map(id => WEAPONS[id].name).join(', ')}`,
};
// "1" → CHAPTER 1, "2" → CHAPTER 2, "외전"/"1외전" → CHAPTER 1 외전, "2외전" → CHAPTER 2 외전, "0"/"tutorial" → 튜토리얼, "all" → 전부
function findChapters(arg) {
  arg = (arg || '').trim().toLowerCase();
  if (arg === 'all') return CHAPTERS.slice();
  const ch = CHAPTERS.find(c => c.id === arg || c.label.toLowerCase() === arg || c.label.toLowerCase() === `chapter ${arg}`
    || (arg === '0' && c.id === 'tutorial') || (arg.includes('외전') && c.id === (arg.includes('2') ? 'ch3side' : 'ch2side')));
  return ch ? [ch] : null;
}

  itemGetEl.classList.add('hidden');
  if (G.unlocks && G.unlocks.length) { showUnlock(); return; }   // 아이템 다음엔 새로 열린 챕터
  G.paused = false; last = performance.now();
}
function showUnlock() {
  const list = G.unlocks; G.unlocks = [];
  G.itemShown = true; G.paused = true; G.banner = null; itemGetAt = performance.now();
  if (P.guarding) endGuard();
  itemGetBox.style.setProperty('--gc', '#ffd23a');
  itemGetBox.innerHTML = `
    <div class="ig-head">새 챕터 해제!</div>
    <div class="ig-chapters">${list.map(c => `
      <div class="ig-ch">
        <div class="ig-thumb" style="background-image:url('${encodeURI(c.thumb || c.background || '')}')"></div>
        <small>${c.label}</small><b>${c.name}</b>
      </div>`).join('')}</div>
    <div class="ig-key">아무 키나 누르세요 · 챕터 선택에서 플레이</div>`;
  itemGetBox.style.animation = 'none'; void itemGetBox.offsetWidth; itemGetBox.style.animation = '';
  itemGetEl.classList.remove('hidden');
  SFX.ready();
}
window.addEventListener('keydown', closeItemGet, true);
window.addEventListener('mousedown', closeItemGet, true);
window.addEventListener('contextmenu', e => { if (!itemGetEl.classList.contains('hidden')) e.preventDefault(); }, true);

function showResult(win) {
  const t = G.time - G.startTime, ch = chapter(), i = G.chapter;
  const ni = ch.next ? CHAPTERS.findIndex(c => c.id === ch.next) : i + 1, hasNext = win && CHAPTERS[ni] && isUnlocked(CHAPTERS[ni]);
  const cp = !win && G.checkpoint;
  panel.innerHTML = `
    <div class="title">${win ? 'CLEAR!' : 'K.O.'}</div>
    <div class="sub">${ch.label} · ${ch.name}${win ? '' : ' — 쓰러졌다'}</div>
    ${win && G.hpUp ? `<div class="reward">최대 체력 +${G.hpUp}! <b style="color:#5be07a">HP ${maxHp()}</b></div>` : ''}
    ${win && G.newWeapon ? `<div class="reward">새 무기 획득! <b style="color:${gradeOf(WEAPONS[G.newWeapon]).color}">${WEAPONS[G.newWeapon].name}</b> <small>(I 인벤토리에서 장착)</small></div>` : ''}
    <div class="stats">
      <div><span>시간</span><b>${t.toFixed(1)}초</b></div>
      <div><span>준 피해</span><b>${fmt(G.dealt)}</b></div>
      <div><span>받은 피해</span><b>${fmt(G.taken)}</b></div>
      <div><span>최대 콤보</span><b>${G.maxCombo}</b></div>
    </div>
    ${win ? `<div class="result-btns win">
      ${hasNext ? `<button class="big" data-r="next">${CHAPTERS[ni].label} 시작 ▶</button>` : `<button class="big" data-r="chapters">챕터 선택</button>`}
      <button data-r="menu">타이틀 화면으로 나가기</button>
    </div>` : `<div class="result-btns">
      ${cp ? `<button data-r="boss">${cp.label || '보스전부터 다시'}</button>` : ''}
      <button data-r="again">${cp ? '처음부터 다시' : '다시 도전'}</button>
      <button data-r="chapters">챕터 선택</button>
      <button data-r="menu">타이틀로</button>
    </div>`}`;
  ui.classList.remove('hidden');
  panel.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {
    const r = b.dataset.r;
    if (r === 'next') begin(ni);
    else if (r === 'boss') begin(i, cp);
    else if (r === 'again') begin(i);
    else if (r === 'chapters') { showMenu(); showChapters(); }
    else showMenu();
  }));
}

resize();
fitStage();
rawMouse.x = mouse.x = W / 2; rawMouse.y = mouse.y = H / 2;
if (document.fonts) document.fonts.load('40px "Black Han Sans"');
const needed = [];
for (const w of Object.values(WEAPONS)) {
  if (w.icon) needed.push(w.icon);
  for (const v of Object.values(w.sprites)) needed.push(...(Array.isArray(v) ? v.map(f => f.src) : [v]));
  if (w.counter) { if (w.counter.pose) needed.push(w.counter.pose); if (w.counter.sounds) preloadSounds(w.counter.sounds); }
  if (w.ult) { needed.push(w.ult.bus, ...w.ult.frames.map(f => f.src)); preloadSounds([w.ult.bellSound, w.ult.busSound, w.ult.crashSound]); }
}
needed.push(BERRY, WOOWP, ...Object.values(ANIM).map(a => a.sheet), ...ADS, ...CLIPS.map(c => c.img));
for (const ch of CHAPTERS) {
  needed.push(ch.background, ch.thumb);
  for (const en of ch.enemies) { needed.push(en.img); if (en.phase2) needed.push(en.phase2.img); }
}
const loadMsg = document.getElementById('loadMsg');
loadImages(needed, (d, n) => { loadMsg.textContent = `불러오는 중... ${d}/${n}`; }, () => {
  const missing = [...new Set(needed.filter(n => n && !IMG[n]))];
  loadMsg.textContent = missing.length ? `못 찾은 이미지: ${missing.join(', ')}` : '';
  loaded = true;
});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
